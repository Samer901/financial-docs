function projStaff(p){
  return Object.entries(assignments).filter(([k, a]) => k.startsWith(p.code + "__") && a.personKey && people[a.personKey]).map(([k, a]) => {
    const v = people[a.personKey], pos = (p.positions || []).find(x => pid(x) === (a.posId || a.posCode)) || {};
    return {name: v.name, title: (v.gender === "m" ? pos.title_m : pos.title_f) || pos.title || a.title || ""};
  });
}
/* صاحب طلب الشراء: لهذا المستند فقط — من الموظفين أو قائمة الأشخاص أو اسم ومنصب يدويًا */
function reqUI(p, f){
  const staff = projStaff(p), sn = new Set(staff.map(x => x.name));
  const others = Object.values(people).map(v => v.name).filter(n => n && !sn.has(n)).sort((a, b) => a.localeCompare(b, "ar"));
  const cur = f.reqName || "", known = !cur || sn.has(cur) || others.includes(cur), manual = !!cur && (!sn.has(cur) || !!f.reqTitle);
  const o = (n, t) => `<option value="${esc(n)}" ${!manual && n === cur ? "selected" : ""}>${esc(n)}${t ? " — " + esc(t) : ""}</option>`;
  const def = signer(p, "requester").name;
  return `<div><label>صاحب الطلب (لهذا الطلب فقط)</label><select name="reqPick">
      <option value="">حسب إعداد المشروع${def ? ": " + esc(def) : ""}</option>
      ${staff.length ? `<optgroup label="موظفو المشروع">${staff.map(x => o(x.name, x.title)).join("")}</optgroup>` : ""}
      ${others.length ? `<optgroup label="قائمة الأشخاص">${others.map(n => o(n)).join("")}</optgroup>` : ""}
      <option value="__new" ${manual ? "selected" : ""}>+ اسم ومنصب يدويًا</option></select></div>
    <div class="reqman" ${manual ? "" : "hidden"}><label>اسم صاحب الطلب</label><input name="reqNew" value="${manual ? esc(cur) : ""}"></div>
    <div class="reqman" ${manual ? "" : "hidden"}><label>منصبه</label><input name="reqTitle" value="${manual ? esc(f.reqTitle || "") : ""}"></div>`;
}
function signerSel(p, k, cur){
  const staff = projStaff(p), sn = new Set(staff.map(x => x.name));
  const others = Object.values(people).map(v => v.name).filter(n => n && !sn.has(n)).sort((a, b) => a.localeCompare(b, "ar"));
  const known = !cur || sn.has(cur) || others.includes(cur);
  const o = n => `<option value="${esc(n)}" ${n === cur ? "selected" : ""}>${esc(n)}</option>`;
  return `<select data-sg="${k}" name="n"><option value="">—</option>
    ${staff.length ? `<optgroup label="موظفو المشروع">${staff.map(x => o(x.name)).join("")}</optgroup>` : ""}
    ${others.length ? `<optgroup label="قائمة الأشخاص">${others.map(o).join("")}</optgroup>` : ""}
    <option value="__new" ${known ? "" : "selected"}>+ اسم جديد</option></select>
    <input data-sg="${k}" name="nn" value="${known ? "" : esc(cur)}" placeholder="الاسم" ${known ? "hidden" : ""} style="margin-top:4px">`;
}
function signerFill(sel){
  const k = sel.dataset.sg, nn = document.querySelector(`[data-sg="${k}"][name="nn"]`);
  nn.hidden = sel.value !== "__new"; if(!nn.hidden) nn.focus();
  const x = projStaff(projects[current]).find(s => s.name === sel.value); if(!x) return;
  const t = document.querySelector(`[data-sg="${k}"][name="t"]`); if(t) t.value = x.title;
}

    <div class="tscroll"><table class="ptab ftab" style="min-width:320px"><tbody>

async function saveExp(cfg, m){
  try{ await db.doc("config/expense").set(cfg); expCfg = cfg; editing = false; notice(""); if(m){ m.className = "msg ok"; m.textContent = "تم الحفظ."; } return true; }
  catch(e){ if(m){ m.className = "msg err"; m.textContent = "تعذّر الحفظ."; } return false; }
}

async function actClick(t){
  const a = t.dataset.act, cfg = JSON.parse(JSON.stringify(ecfg())), p = projects[current];
  if(a === "thradd"){ const b = document.querySelector(`[data-thrbody="${t.dataset.key}"]`); b.insertAdjacentHTML("beforeend", thrTable([{upTo:"", quotes:1}], t.dataset.key).match(/<tr[\s\S]*<\/tr>/)[0]); editing = true; return; }
  if(a === "thrdel"){ t.closest("tr").remove(); editing = true; return; }
  if(a === "thrsave"){ cfg.thresholds = readThr("g"); await saveExp(cfg, $("#thr-msg")); return; }
  if(a === "catadd"){
    const name = $("#newcat").value.trim(); if(!name) return;
    if(cfg.categories.some(c => c.name === name)){ $("#newcat").value = ""; return; }
    const id = "c" + Date.now().toString(36);
    cfg.categories.push({id, name, forms: [], docs: {}});
    selCats = new Set([id]);
    if(await saveExp(cfg)) render(true);
    return;
  }
  if(a === "docadd"){
    const name = $("#newdoc").value.trim(); if(!name || cfg.docTypes.includes(name)) return;
    cfg.docTypes.push(name);
    if(await saveExp(cfg)) render(true);
    return;
  }
  if(a === "catdel"){
    if(!confirmClick(t, "اضغط مرة أخرى للتأكيد")) return;
    cfg.categories = cfg.categories.filter(c => !selCats.has(c.id)); selCats.clear();
    if(await saveExp(cfg)) render(true);
    return;
  }
  if(a === "catsave"){
    const docs = {}; document.querySelectorAll('select[name="edoc"]').forEach(x => { if(x.value) docs[x.dataset.type] = x.value; });
    const forms = FORMS.map(x => x[0]).filter(k => docs[k]);
    const names = cfg.categories.filter(c => selCats.has(c.id)).map(c => c.name).join("، ");
    cfg.categories.forEach(c => { if(selCats.has(c.id)){ c.forms = forms; c.docs = docs; } });
    if(await saveExp(cfg)){ selCats.clear(); render(true); const m = $("#cat-top"); if(m){ m.className = "msg ok"; m.textContent = "تم حفظ: " + names; } }
    else { const m = $("#cat-msg"); m.className = "msg err"; m.textContent = "تعذّر الحفظ."; }
    return;
  }
  if(a === "projsave"){
    const m = $("#xp-msg");
    const signers = {}; SIGNERS.forEach(([k]) => { const sv = document.querySelector(`[data-sg="${k}"][name="n"]`).value, n = (sv === "__new" ? document.querySelector(`[data-sg="${k}"][name="nn"]`).value : sv).trim(), ti = document.querySelector(`[data-sg="${k}"][name="t"]`).value.trim(); if(n || ti) signers[k] = {name: n, title: ti}; });
    const start = {}; NUMBERED.forEach(([k]) => { start[k] = Math.max(1, Number(document.querySelector(`[data-st="${k}"]`).value) || 1); });
    const lines = {}; document.querySelectorAll("select[data-line]").forEach(s => { lines[s.dataset.line] = s.value; });
    const expense = {...(p.expense || {}), signers, start, lines, thresholds: $("#x-own").checked ? readThr("p") : null};
    const signatories = {...(p.signatories || {}), pmPositionCode: $("#s-pm").value, othersHiredBy: "pm", pmHiredBy: {name: $("#s-name").value.trim(), capacity: $("#s-cap").value.trim(), gender: $("#s-g").value}};
    const projRequired = [...document.querySelectorAll('input[name="projreq"]:checked')].map(i => i.value);
    try{ await db.doc("projects/" + p.code).update({expense, signatories, projRequired}); editing = false; notice(""); render(true); const mm = $("#xp-msg"); if(mm){ mm.className = "msg ok"; mm.textContent = "تم الحفظ."; } }
    catch(e){ m.className = "msg err"; m.textContent = "تعذّر الحفظ."; }
  }
}

/* العتبة المطابقة لمبلغ فاتورة: تُستخدم لاحقًا في بطاقات الأنشطة */
function thresholdFor(p, amount){
  const list = ((p.expense || {}).thresholds || ecfg().thresholds || []).slice().sort((a, b) => (a.upTo === "" ? Infinity : a.upTo) - (b.upTo === "" ? Infinity : b.upTo));
  return list.find(t => t.upTo === "" || amount <= Number(t.upTo)) || null;
}

  INV:"1Q3tCrozyju8A2Fyaj4MbKY1TxqXQNwN0", RCPT:"1G2RXryPZnqqSGt8KTjMAuSp51X4IVQRF", SRN:"1paJ5g--brYwXGCdvK86O3cfVDItsdR73", ATT:"1pjij7De75nVHEmlJmqvAlzUKlehp-Xu3"};
const UPLOAD_FORMS = []; // كل النماذج تُولَّد؛ العقد يُولَّد من قالب الخبير ويمكن رفع نسخته الموقّعة
const EXPERT_TPL = "19FU9mah6lSqRgGboaH6PIwOpPuisqmOP";
const exPerson = e => e.personKey ? people[e.personKey] : null;
function attFile(e, t){
  const a = (e.att || {})[t]; if(a) return a.id;
  const v = exPerson(e); if(!v) return "";
  if(t === "صورة هوية") return v.idFileId || ""; if(t === "سيرة ذاتية") return v.cvFileId || "";
  return "";
}
const fLabel = k => { const f = FORMS.find(x => x[0] === k); return (FORM_CODE[k] || k) + (f ? " — " + f[1].replace(/ \(.*\)/, "") : ""); };
const dmy = s => s ? s.split("-").reverse().join("/") : "";
const num = v => Number(v) || 0;

function exOf(p){ return Object.entries(expenses).filter(([k, e]) => e.project === p.code).map(([k, e]) => ({key: k, ...e})); }
function exCat(p, e){ const cfg = ecfg(); const id = e.cat || ((p.expense || {}).lines || {})[e.line] || LINE_DEFAULT[e.line] || ""; return (cfg.categories || []).find(c => c.id === id) || null; }
function exForms(cat){ return cat ? FORMS.map(x => x[0]).filter(k => (cat.docs || {})[k]) : []; }
function exAttach(cat){ return cat ? (ecfg().docTypes || []).filter(t => (cat.docs || {})[t]) : []; }
function itemPrice(it){ return it.sp !== "" && it.sp !== undefined && it.sp !== null ? num(it.sp) : num(it.p); }
function exTotals(e, supplier){
  const items = e.items || [], f = e.f || {};
  const sub = items.reduce((s, it) => s + num(it.q) * (supplier ? itemPrice(it) : num(it.p)) * (num(it.dur) || 1), 0);
  return {sub, total: sub + num(f.delCharge) - num(f.discount)};
}
function nextNum(p, type){
  const used = exOf(p).map(e => num((e.nums || {})[type])).filter(Boolean);
  const start = num(((p.expense || {}).start || {})[type]) || 1;
  return Math.max(start - 1, ...used, 0) + 1;
}
const signer = (p, k) => (((p.expense || {}).signers || {})[k]) || {name: "", title: ""};

function renderExpenses(p){

function exRead(card){
  const e = JSON.parse(JSON.stringify(expenses[card.dataset.exKey] || {}));
  const v = n => { const el = card.querySelector(`[name="${n}"]`); return el ? el.value.trim() : undefined; };
  e.f = e.f || {};
  ["prDate","delDate","rfqMode","rfqDate","rfqEnd","delAddr","delMethod","payC","payG","poDate","delCharge","discount","contractNo","grnDate","grnLoc","supInv","srnDate","srnPct","attPeriod","attList","invSrc","invNo","invDate","rcptDate","rcptPurpose","cDate","cStart","cEnd","cDuties"]
    .forEach(n => { const x = v(n); if(x !== undefined) e.f[n] = x; });
  const rp = v("reqPick"); if(rp !== undefined){ if(rp === "__new"){ e.f.reqName = v("reqNew") || ""; e.f.reqTitle = v("reqTitle") || ""; } else { e.f.reqName = rp; e.f.reqTitle = ""; } }
  if(card.querySelector('[name="s_name"]')) e.f.sup = {name: v("s_name"), company: v("s_company"), mobile: v("s_mobile"), email: v("s_email"), addr: v("s_addr"), prof: v("s_prof")};
  if(v("mode")) e.mode = v("mode");
  const ps = v("s_person"); if(ps !== undefined && ps !== "__new") e.personKey = ps;
  if(v("title") !== undefined) e.title = v("title");
  if(v("descEn") !== undefined) e.descEn = v("descEn");
  const rows = [...card.querySelectorAll("tr[data-it]")];
  if(rows.length) e.items = rows.map(tr => { const q = n => { const el = tr.querySelector(`[name="${n}"]`); return el ? el.value.trim() : ""; };
    return {d: q("d"), u: q("u"), q: q("q"), dur: q("dur") || 1, p: q("p"), sp: q("sp"), n: q("n"), cm: q("cm")}; }).filter(it => it.d || it.q || it.p);
  if(e.f.rcptDate) e.month = e.f.rcptDate.slice(0, 7);
  return e;
}

async function exFolder(p, e){
  const root = await ensureFolder("المصاريف", (p.folders || {}).project, "exroot", p);
  const line = (p.positions || []).find(x => pid(x) === e.line);
  return ensureFolder(`${line ? line.code + " - " : ""}${e.title || "عملية"} - ${e.id}`.replace(/[\\/:*?"<>|]/g, " "), root, "ex:" + e.id, p);
}

async function exSave(card, say){
  const p = projects[current], key = card.dataset.exKey, e = exRead(card);
  const sel = card.querySelector('[name="s_person"]');
  const fileOf = n => { const i = card.querySelector(`[name="${n}"]`); return i && i.files && i.files[0]; };
  const npName = ((card.querySelector('[name="np_name"]') || {}).value || "").trim();
  if(sel && ((sel.value === "__new" && npName) || (sel.value !== "__new" && e.personKey && (fileOf("np_id") || fileOf("np_cv"))))){
    let pk = e.personKey, person;
    if(sel.value === "__new"){
      const g = n => (card.querySelector(`[name="${n}"]`) || {}).value || "";
      const name = g("np_name").trim(); if(!name) throw {code:"tool_error", message:"أدخل اسم الشخص الجديد."};
      if(Object.values(people).some(x => (x.name || "").replace(/\s+/g, " ") === name.replace(/\s+/g, " "))) throw {code:"tool_error", message:"هذا الاسم موجود في القائمة. اختره منها."};
      pk = "new-" + Date.now().toString(36);
      person = {name, nameEn: "", father: g("np_father").trim(), mother: g("np_mother").trim(), dob: g("np_dob"), nid: g("np_nid").trim(), gender: g("np_gender"), nationality: g("np_nat").trim(),
        mobile: (e.f.sup || {}).mobile || "", address: (e.f.sup || {}).addr || "", idFileId: "", cvFileId: "", status: "pending", docs: []};
      e.f.sup = {...(e.f.sup || {}), name};
    } else person = {...people[pk]};
    const safe = person.name.replace(/[\\/:*?"<>|]/g, " ").trim();
    if(fileOf("np_id")){ say("جارٍ رفع الهوية…"); const r = await upload(fileOf("np_id"), FOLD.ids, `ID_${safe}`); if(person.idFileId) await trash(person.idFileId).catch(() => {}); person.idFileId = r.id; person.idFileName = r.title; person.status = "pending"; }
    if(fileOf("np_cv")){ say("جارٍ رفع السيرة…"); const r = await upload(fileOf("np_cv"), FOLD.cvs, `CV_${safe}`); if(person.cvFileId) await trash(person.cvFileId).catch(() => {}); person.cvFileId = r.id; person.cvFileName = r.title; }
    await db.doc("people/" + pk).set(person); people[pk] = person; e.personKey = pk;
    if(sel.value === "__new"){ const op = document.createElement("option"); op.value = pk; op.textContent = person.name; sel.prepend(op); sel.value = pk; const np = card.querySelector(".newperson"); if(np) np.hidden = true; }
  }
  const folderNeeded = [...card.querySelectorAll('input[type="file"]')].some(i => i.files && i.files[0] && !["np_id","np_cv"].includes(i.name));
  if(folderNeeded){
    const folder = await exFolder(p, e);
    for(const i of card.querySelectorAll('input[type="file"]')){

async function exGenForm(p, e, code, say){
  const tplId = templates["ex" + code] || FORM_TPL[code];
  const tpl = await loadX(tplId);
  const folder = await exFolder(p, e);
  e.nums = e.nums || {};
  if(["PR","PO","GRN","SRN","RCPT"].includes(code) && !e.nums[code]) e.nums[code] = nextNum(p, code);
  const copies = code === "RFQ" ? Math.max(1, (thresholdFor(p, exTotals(e, true).total) || {}).quotes || 1) : 1;
  const out = [];
  for(let i = 0; i < copies; i++){
    say(`جارٍ إنشاء ${FORM_CODE[code] || code}${copies > 1 ? ` (${i + 1}/${copies})` : ""}…`);
    let x = tpl.xml;
    for(const [ref, v] of Object.entries(exFill(p, e, code, i))) x = setCell(x, ref, v === undefined ? "" : v);
    const base = `${FORM_CODE[code] || code}${e.nums[code] ? " " + e.nums[code] : ""}${copies > 1 ? " - نسخة " + (i + 1) : ""} - ${e.title || e.id}`;
    out.push(await saveXP(await buildX(tpl, x), folder, base, tpl));
  }
  const old = (e.files || {})[code];
  for(const o of [].concat(old || [])) await trashSet(o).catch(() => {});
  e.files = e.files || {}; e.files[code] = code === "RFQ" ? out : out[0];
}

function exWarnings(p, e){
  const f = e.f || {}, forms = exForms(exCat(p, e)), w = [];
  const seq = [["PR","prDate","طلب الشراء"],["RFQ","rfqDate","إرسال عرض السعر"],["PO","poDate","أمر الشراء"],["CONTRACT","cDate","تحرير العقد"],["CONTRACT","cStart","بداية التنفيذ"],
    ["CONTRACT","cEnd","نهاية التنفيذ"],["GRN","grnDate","استلام المواد"],["SRN","srnDate","استلام الخدمة"],["INV","invDate","الفاتورة"],["RCPT","rcptDate","الإيصال"]]
    .filter(([k, n]) => forms.includes(k) && f[n]);
  for(let i = 1; i < seq.length; i++){ const [, n, l] = seq[i];
    const prev = seq.slice(0, i).filter(x => f[x[1]] > f[n]).pop();
    if(prev) w.push(`تاريخ ${l} (${dmy(f[n])}) قبل تاريخ ${prev[2]} (${dmy(f[prev[1]])}).`); }
  if(f.delDate && f.prDate && f.delDate < f.prDate) w.push("تاريخ التسليم قبل تاريخ طلب الشراء.");
  if(f.rfqEnd && f.rfqDate && f.rfqEnd < f.rfqDate) w.push("انتهاء صلاحية العرض قبل تاريخ إرساله.");
  if(forms.includes("SRN") && f.srnDate && f.cEnd && f.srnDate < f.cEnd) w.push("استلام الخدمة قبل نهاية التنفيذ.");
  seq.forEach(([, n, l]) => { if(p.start && f[n] < p.start) w.push(`تاريخ ${l} قبل بداية المشروع (${dmy(p.start)}).`); else if(p.end && f[n] > p.end) w.push(`تاريخ ${l} بعد نهاية المشروع (${dmy(p.end)}).`); });
  return w;
}

async function exGenerate(card, codes, say){
  const p = projects[current];
  if(!mcp){ say("الوصول إلى Google Drive غير متاح في هذا العرض.", true); return; }
  try{
    const warn = exWarnings(p, exRead(card));
    if(warn.length && card.dataset.okdates !== "1"){ card.dataset.okdates = "1"; say("تواريخ غير متسلسلة (انظر التنبيه). اضغط زر الإنشاء مرة أخرى للمتابعة رغم ذلك.", true); return; }
    delete card.dataset.okdates;
    say("جارٍ الحفظ…");
    const e = await exSave(card, say), key = card.dataset.exKey;
    const cat = exCat(p, e);
    const list = (codes && codes[0] === "CONTRACT_WORD" ? ["CONTRACT"] : (codes || exForms(cat))).filter(c => (FORM_TPL[c] || c === "CONTRACT") && !(c === "INV" && (e.f || {}).invSrc !== "system"));
    if(list.includes("RCPT") && !(e.f || {}).rcptDate){ say("أدخل تاريخ الإيصال أولاً.", true); return; }
    const keep = async () => { e.done = !!(e.files || {}).RCPT; await db.doc("expenses/" + key).set(e); expenses[key] = e; };
    try{
      for(const c of list){ if(c === "CONTRACT" && codes && codes[0] === "CONTRACT_WORD"){ await exContract(p, e, say, true); await keep(); continue; } if(c === "CONTRACT"){ if(!(codes || []).includes("CONTRACT") && (e.files || {}).CONTRACT && (e.files.CONTRACT || {}).signed) continue; await exContract(p, e, say); } else await exGenForm(p, e, c, say); await keep(); }
    }catch(err){ await keep().catch(() => {}); throw err; }
    e.done = !!(e.files || {}).RCPT;
    await db.doc("expenses/" + key).set(e);
    editing = false; exOpen.add(key); render(true);
    const m = document.querySelector(`[data-ex-key="${CSS.escape(key)}"] .exmsg`); if(m){ m.className = "msg exmsg ok"; m.textContent = "تم الإنشاء."; }
  }catch(err){ say(err && err.code === "tool_error" ? (err.message || mcpMessage(err)) : mcpMessage(err), true); }
}

async function exContract(p, e, say, wordOnly){

  if(!v.gender) throw {code:"tool_error", message:"جنس المتعاقد غير مسجّل. أدخله أو اطلب من Claude قراءة الهوية."};
  if(!f.cStart || !f.cEnd) throw {code:"tool_error", message:"أدخل بداية التنفيذ ونهايته."};

  const tags = {

    SALARY: qty > 1 ? `يحدد الأجر بقيمة ${price.toLocaleString("en-US")} ${cur} عن كل ${unit}، لعدد ${qty} ${plural}، بإجمالي ${T.total.toLocaleString("en-US")} ${cur} (${words(T.total)} ${cur}) فقط لا غير، تُدفع بعد استلام المخرجات.`

function exParts(p, e){
  const cat = exCat(p, e), files = e.files || {}, parts = [];
  for(const c of exForms(cat)){ const o = files[c]; if(!o) continue;
    [].concat(o).forEach((x, i, arr) => parts.push([(FORM_CODE[c] || c) + (arr.length > 1 ? " " + (i + 1) : ""), x.pdf || x.id || x.xlsx, {skipCover: c === "CONTRACT" && !!x.word}])); }
  exAttach(cat).forEach(t => { const id = attFile(e, t); if(id) parts.push([t, id]); });

  return items;

let syncBusy = false, syncAt = 0;
const mainId = o => o ? (o.pdf || o.xlsx || o.id || o.fileId || o.word || "") : "";
async function syncDeleted(force){
  if(syncBusy || !window.appStore || !window.appStore.missingFiles || !db) return;
  if(!force && Date.now() - syncAt < 90000) return;
  syncBusy = true; syncAt = Date.now();
  try{
    const ids = [];
    Object.values(payrolls).forEach(d => { const f = d.files || {}; ids.push(mainId(f.payroll)); Object.values(f.vouchers || {}).forEach(o => ids.push(mainId(o))); });
    Object.values(timesheets).forEach(d => Object.values(d.files || {}).forEach(o => ids.push(mainId(o))));
    Object.values(projects).forEach(p => Object.values(p.docFiles || {}).forEach(o => ids.push(o.id)));
    Object.values(expenses).forEach(e => { Object.values(e.files || {}).forEach(o => [].concat(o).forEach(x => ids.push(mainId(x)))); Object.values(e.att || {}).forEach(o => ids.push(o.id)); });
    Object.values(assignments).forEach(a => (a.docs || []).forEach(d => ids.push(d.fileId || d.wordId)));
    Object.values(people).forEach(v => { ids.push(v.idFileId, v.cvFileId); (v.docs || []).forEach(d => ids.push(d.fileId)); });
    const gone = await window.appStore.missingFiles(ids.filter(Boolean));
    if(!gone.size) return;
    const G = o => o && gone.has(mainId(o)); let n = 0;
    for(const [k, d] of Object.entries(payrolls)){ const f = JSON.parse(JSON.stringify(d.files || {})); let ch = false;
      if(G(f.payroll)){ delete f.payroll; ch = true; } for(const id in (f.vouchers || {})) if(G(f.vouchers[id])){ delete f.vouchers[id]; ch = true; }
      if(ch){ n++; await db.doc("payroll/" + k).set({...d, files: f}); } }
    for(const [k, d] of Object.entries(timesheets)){ const f = {...(d.files || {})}; let ch = false;
      for(const id in f) if(G(f[id])){ delete f[id]; ch = true; } if(ch){ n++; await db.doc("timesheets/" + k).set({...d, files: f}); } }
    for(const [k, p] of Object.entries(projects)){ const df = {...(p.docFiles || {})}; let ch = false;
      for(const id in df) if(gone.has(df[id].id)){ delete df[id]; ch = true; } if(ch){ n++; await db.doc("projects/" + k).set({...p, docFiles: df}); } }
    for(const [k, e] of Object.entries(expenses)){ const ne = JSON.parse(JSON.stringify(e)); let ch = false;
      for(const c in (ne.files || {})){ const o = ne.files[c];
        if(Array.isArray(o)){ const f = o.filter(x => !G(x)); if(f.length !== o.length){ ch = true; if(f.length) ne.files[c] = f; else delete ne.files[c]; } }
        else if(G(o)){ delete ne.files[c]; ch = true; } }
      for(const t in (ne.att || {})) if(gone.has(ne.att[t].id)){ delete ne.att[t]; ch = true; }
      if(ch){ ne.done = !!(ne.files || {}).RCPT; n++; await db.doc("expenses/" + k).set(ne); } }
    for(const [k, a] of Object.entries(assignments)){ const docs = (a.docs || []).filter(d => !gone.has(d.fileId || d.wordId));
      if(docs.length !== (a.docs || []).length){ n++; await db.doc("assignments/" + k).set({...a, docs}); } }
    for(const [k, v] of Object.entries(people)){ const nv = {...v}; let ch = false;
      if(gone.has(nv.idFileId)){ nv.idFileId = ""; nv.idFileName = ""; ch = true; } if(gone.has(nv.cvFileId)){ nv.cvFileId = ""; nv.cvFileName = ""; ch = true; }
      const docs = (nv.docs || []).filter(d => !gone.has(d.fileId)); if(docs.length !== (nv.docs || []).length){ nv.docs = docs; ch = true; }
      if(ch){ n++; await db.doc("people/" + k).set(nv); } }
    if(n){ editing = false; render(true); notice(`أُزيل من التطبيق ${gone.size} ملف حُذف من الدرايف.`); }
  }catch(e){ console.error("sync", e); }
  finally{ syncBusy = false; }
}

  else if(t.dataset.stepGo) goStep(t.dataset.stepGo);
  else if(t.id === "modeBtn"){ page = page === "setup" ? "work" : "setup"; setHash(); editing = false; render(true); window.scrollTo({top: 0}); }
  else if(t.id === "stepPrev"){ const main = STEPS.filter(x => !EXTRA_STEPS.includes(x[0])), i = main.findIndex(x => x[0] === step); if(i > 0) goStep(main[i - 1][0]); }
  else if(t.id === "stepNext"){ const main = STEPS.filter(x => !EXTRA_STEPS.includes(x[0])), i = main.findIndex(x => x[0] === step); stepSave().then(() => { if(i >= 0 && main[i + 1]) goStep(main[i + 1][0]); else { page = "work"; setHash(); editing = false; render(true); window.scrollTo({top: 0}); } }); }
  else if(t.id === "switchAcct"){ if(window.appAuth) window.appAuth.switchAccount().catch(e => notice("تعذّر تغيير الحساب: " + (e && (e.message || e.type) || e), true)); }
  else if(t.dataset.blSave) saveBudget();
  else if(t.dataset.todo){ wtab = t.dataset.todo; setHash(); renderShell(projects[current]); if(t.dataset.exk){ exOpen.add(t.dataset.exk); renderExpenses(projects[current]); const c = document.querySelector(`[data-ex-key="${CSS.escape(t.dataset.exk)}"]`); if(c) c.scrollIntoView({block: "start"}); } else document.getElementById("workTabs").scrollIntoView({block: "start"}); }
  else if(t.id === "prSave"){ prSaveInputs().then(() => { editing = false; const m=$("#pr-msg"); m.className="msg ok"; m.textContent="تم الحفظ."; }).catch(() => { const m=$("#pr-msg"); m.className="msg err"; m.textContent="تعذّر الحفظ."; }); }
  else if(t.id === "tsSave"){ tsSaveInputs().then(() => { editing = false; const m=$("#ts-msg"); m.className="msg ok"; m.textContent="تم الحفظ."; }).catch(() => { const m=$("#ts-msg"); m.className="msg err"; m.textContent="تعذّر الحفظ."; }); }
  else if(t.dataset.editp){ editPerson = t.dataset.editp; render(true); }
  else if(t.dataset.cancelp !== undefined){ editPerson = ""; render(true); }
  else if(t.dataset.savep !== undefined) busy(t, () => savePerson(t));
  else if(t.dataset.newp !== undefined) busy(t, () => addPerson(t));
  else if(t.id === "saveDuties" || t.dataset.addset) saveDuties();
  else if(t.dataset.delset) deleteDutySet(t);
  else if(t.dataset.delmonth) busy(t, () => deleteMonth(t));
  else if(t.dataset.deldoc) busy(t, () => deleteDocFile(t));
  else if(t.dataset.rmline) removeLine(t);
  else if(t.dataset.del) deleteDoc(t);
  else if(t.dataset.unassign) unassign(t);
  else if(t.dataset.act) actClick(t);
  else if(t.dataset.ex){ if(["gen","genword","genall","c2pdf","save","del","upload"].includes(t.dataset.ex)) busy(t, () => exClick(t)); else exClick(t); }
  else if(t.dataset.rateAct) rateAct(t);
  else if(t.dataset.rp){ const say = (x, err) => { const m = $("#rp-msg"); if(m){ m.className = "msg" + (err ? " err" : ""); m.textContent = x; } if(err) notice("التقرير المالي: " + x, true); };
    if(t.dataset.rp === "save") rpSave().then(() => { editing = false; say("تم الحفظ."); }).catch(() => say("تعذّر الحفظ.", true)); else busy(t, () => rpMake(say)); }
});

(async () => {
  db = await claude.use("db");
  if(!db){
    $("#content").innerHTML = '<p class="empty">تعذّر الاتصال بالبيانات.</p>';
    $("#project").innerHTML = '<option value="">غير متاح</option>';
    return;
  }
  const timer = setTimeout(() => notice("تعذّر الوصول إلى البيانات حتى الآن. تحقق من الاتصال.", true), 10000);
  db.collection("projects").onSnapshot(s => {
    projects = {}; s.docs.forEach(d => { projects[d.id] = d.data(); });
    if(!s.metadata.fromCache){ clearTimeout(timer); notice(""); }
    render();
  }, () => { clearTimeout(timer); notice("تعذّر تحميل المشاريع.", true); });
  db.collection("assignments").onSnapshot(s => {
    assignments = {}; s.docs.forEach(d => { assignments[d.id] = d.data(); });
    render();
  }, () => notice("تعذّر تحميل بيانات الكادر.", true));
  db.doc("config/duties").onSnapshot(d => { duties = (d.exists && d.data().sets) || {}; render(); }, () => {});
  db.doc("config/holidays").onSnapshot(d => { holidays = (d.exists && d.data().dates) || []; render(); }, () => {});
  db.collection("payroll").onSnapshot(q => { payrolls = {}; q.docs.forEach(d => { payrolls[d.id] = d.data(); }); render(); }, () => {});
  db.collection("timesheets").onSnapshot(q => { timesheets = {}; q.docs.forEach(d => { timesheets[d.id] = d.data(); }); render(); }, () => {});
  db.doc("config/excel").onSnapshot(d => { excelCfg = (d.exists && d.data()) || {}; renderPeople(); }, () => {});
  db.collection("expenses").onSnapshot(q => { expenses = {}; q.docs.forEach(d => { expenses[d.id] = d.data(); }); render(); }, () => {});
  document.addEventListener("toggle", ev => { const d = ev.target; if(d.matches && d.matches("details.excard")){ if(d.open) exOpen.add(d.dataset.exKey); else exOpen.delete(d.dataset.exKey); } }, true);
  db.doc("config/expense").onSnapshot(d => { expCfg = (d.exists && d.data()) || null; render(); }, () => {});
  db.doc("config/templates").onSnapshot(d => { templates = (d.exists && d.data()) || {}; }, () => {});
  db.collection("people").onSnapshot(s => {
    people = {}; s.docs.forEach(d => { people[d.id] = d.data(); });
    render();
  }, () => notice("تعذّر تحميل قائمة الأشخاص.", true));
  loadDir();
  setTimeout(() => syncDeleted(true), 4000);
  mcp = await claude.use("mcp");
  if(mcp){
    try{ const t = await mcp.listTools(); fileArgs = !!t.fileArgs; }catch(_){}
  } else {
    
  }
})();
</script>

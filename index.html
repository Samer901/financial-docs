<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التوثيقات المالية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* layout: header with project picker, then grid of position cards grouped by budget section */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --ink:#18231f; --muted:#5d6b66; --line:#d9e0dd;
  --accent:#1d6b57; --accent-ink:#ffffff; --ok:#1f7a3d; --warn:#a15c00; --err:#b3261e;
  --font:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111816; --surface:#1a2320; --ink:#e6eeeb; --muted:#9aaba5; --line:#2c3a36;
    --accent:#4fb596; --accent-ink:#0d1714; --ok:#5cc47c; --warn:#e0a040; --err:#f08078;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#1a2320; --ink:#e6eeeb; --muted:#9aaba5; --line:#2c3a36;
  --accent:#4fb596; --accent-ink:#0d1714; --ok:#5cc47c; --warn:#e0a040; --err:#f08078;
  color-scheme: dark;
}
*{box-sizing:border-box}
#gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;max-width:420px;text-align:center;display:grid;gap:12px}
.gate-card h2{margin:0}
#syncStatus{font-size:13px;font-weight:400;margin-inline-start:8px}

[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px 48px;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between}
h1{font-size:24px;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:14px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
select,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
select{min-width:280px}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.notice{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--warn);border-radius:8px;padding:10px 14px;font-size:14px}
.notice.err{border-inline-start-color:var(--err)}
#snacks{position:fixed;inset-inline:16px;bottom:16px;z-index:1000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#snacks > .notice{pointer-events:auto;width:100%;max-width:640px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
#busybar{border-inline-start-color:var(--accent)}
button.busy{cursor:progress;opacity:.85}
button.busy::after{content:"";display:inline-block;width:.9em;height:.9em;margin-inline-start:8px;border:2px solid currentColor;border-inline-end-color:transparent;border-radius:50%;vertical-align:-.15em;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){button.busy::after{animation-duration:2.4s}}
.group{display:grid;gap:12px}
.group h2{font-size:16px;margin:8px 0 0;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;align-content:start}
.card-head{display:flex;justify-content:space-between;gap:8px;align-items:start}
.title{font-weight:600;font-size:16px}
.code{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.pill{font-size:12px;border-radius:999px;padding:2px 10px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.pill.saved{color:var(--warn);border-color:var(--warn)}
.pill.up{color:var(--accent);border-color:var(--accent)}
.pill.read{color:var(--ok);border-color:var(--ok)}
.pill.err{color:var(--err);border-color:var(--err)}
.chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:end}
.review{font-size:13px;color:var(--err)}
.req{color:var(--err);font-weight:700}
.docs{margin:4px 0 0;padding-inline-start:18px;font-size:13px;display:grid;gap:2px}
.docs a{color:var(--accent)}
button.ghost{background:transparent;color:var(--accent);border:1px dashed var(--accent);padding:6px 12px;font-weight:500}
button.x{background:transparent;color:var(--err);border:1px solid transparent;padding:2px 8px;font-size:12px;font-weight:500}
button.x.armed{border-color:var(--err)}
.xrows{display:grid;gap:8px;margin:8px 0}
.xrow{display:grid;grid-template-columns:1.3fr 1fr;gap:6px;padding:8px;border:1px solid var(--line);border-radius:8px}
.xrow input[type=file]{grid-column:1/-1;font-size:13px}
.xrow select{min-width:0}
.grid > button.ghost{align-self:start;justify-self:start}
.dgrid{display:grid;grid-template-columns:repeat(7,30px);gap:3px;direction:rtl}
.dh{font-size:11px;color:var(--muted);text-align:center}
.dday{padding:4px 0;font-size:12px;font-weight:500;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px}
.dday.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dday.wkend{background:transparent;color:var(--muted);border-style:dashed}
.dday:disabled{opacity:.45;cursor:default}
.hol{margin:4px 0 12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{white-space:nowrap}
.wrap > *,.tabpane > *,details.settings{min-width:0}
.tab{background:transparent;color:var(--muted);border-radius:8px 8px 0 0;border:1px solid transparent;border-bottom:0;padding:8px 16px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);border-color:var(--line)}
.tabpane{display:grid;gap:20px}
.wk{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px}
.chk{display:inline-flex;gap:4px;align-items:center;color:var(--ink);margin:0}
.pform{background:var(--bg);border-radius:8px;padding:8px}
.cbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px dashed var(--line);padding-top:8px}
details.settings{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
details.settings > summary{cursor:pointer;font-weight:600}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:12px 0}
.sgrid input,.sgrid select,.ptab input,.ptab select,.dset textarea,.dset input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.tscroll{overflow-x:auto}
.ptab{border-collapse:collapse;width:100%;font-size:14px;min-width:720px}
.ptab th,.ptab td{border-bottom:1px solid var(--line);padding:6px;text-align:start;vertical-align:middle}
.ptab th{color:var(--muted);font-weight:500;font-size:13px}
details.duties{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
details.duties summary{cursor:pointer;color:var(--accent)}
.dset{margin:8px 0}
details.addline{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 14px}
details.addline summary{cursor:pointer;color:var(--accent);font-weight:500}
.alg{display:grid;grid-template-columns:120px 1fr 1fr;gap:8px;margin:10px 0}
@media (max-width:600px){.alg{grid-template-columns:1fr}}
details.extra{border-top:1px dashed var(--line);padding-top:8px}
details.extra summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:500}
input[type=date]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.file{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.file input{font:inherit;font-size:13px;max-width:100%}
.current{font-size:13px;color:var(--muted)}
.current a{color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
button{font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 18px;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.msg{font-size:13px}
.msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
.empty{color:var(--muted)}
.bar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 0;display:flex;gap:12px;align-items:center;justify-content:space-between}
.catgrid{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.catgrid .chk{border:1px solid var(--line);border-radius:999px;padding:3px 12px;background:var(--bg);font-size:14px}
fieldset.exs{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0;display:grid;gap:8px}
fieldset.exs legend{font-size:14px;font-weight:600;padding:0 6px}
details.excard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px}
details.excard > summary{list-style:none}
details.excard[open]{gap:12px}
.catgrid .chk.done{border-color:var(--ok);color:var(--ok)}
.catgrid .chk:has(input:checked){border-color:var(--accent);background:var(--surface);outline:2px solid var(--accent)}
.ced{border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0;display:grid;gap:10px}
.ced h3,.settings h3{font-size:14px;margin:6px 0 0;color:var(--muted);font-weight:600}
.ftab td select,.ftab td input{min-width:0}
.inl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mpick{flex-wrap:nowrap}
.mpick select{width:auto;min-width:0}
.inl input{max-width:240px}

/* ===== نظام الواجهة الموحّد ===== */
.wrap{max-width:1100px;gap:16px}
.tabs{gap:2px;border-bottom:2px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;padding-top:6px}
.tab{border:0;border-radius:6px 6px 0 0;padding:10px 16px;font-weight:600;color:var(--muted);margin-bottom:-2px;border-bottom:2px solid transparent}
.tab[aria-selected="true"]{background:transparent;color:var(--accent);border-bottom-color:var(--accent)}
.tab-gear{margin-inline-start:auto;font-weight:500}
.tabpane{gap:14px}
details.settings{padding:0;border-radius:10px;overflow:visible}
details.settings > summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;font-size:16px;font-weight:600}
details.settings > summary::-webkit-details-marker{display:none}
details.settings > summary::before{content:"▾";color:var(--muted);font-size:14px;width:14px;flex:none}
details.settings:not([open]) > summary::before{content:"◂"}
details.settings > summary > span:first-of-type{flex:1}
details.settings[open] > summary{border-bottom:1px solid var(--line)}
details.settings > :not(summary){margin-inline:18px}
details.settings > :last-child{margin-bottom:18px}
details.settings > summary + *{margin-top:14px}
.phead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end}
.phead .msg{margin-inline-end:auto}
.phead .mpick{margin-inline-end:auto}
.phead .mpick + .msg{margin-inline-end:0}
.settings h3{font-size:14px;font-weight:600;color:var(--ink);margin:22px 0 8px}
.sgrid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 14px;margin:10px 0}
.sgrid > div{display:flex;flex-direction:column;min-width:0}
.sgrid input,.sgrid select,.ptab input,.ptab select,.dset textarea,.dset input,.alg input,.alg select{min-height:38px;background:var(--surface);border-radius:8px;padding:7px 10px}
.sgrid select,.alg select{min-width:0}
.sgrid input:disabled{background:var(--bg);color:var(--muted)}
label{font-size:13px}
.badge{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn);white-space:nowrap}
.badge.ok{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok)}
.missbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--warn);border-radius:10px;padding:12px 16px}
.missbar.ok{border-inline-start-color:var(--ok)}
.missbar strong{margin-inline-end:8px}
.chipbtn{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:500;font-size:13px}
.chipbtn:hover{border-color:var(--warn)}
.panel{scroll-margin-top:60px}
.group h2{scroll-margin-top:60px;display:flex;gap:10px;align-items:center;color:var(--ink)}
.bar{z-index:4;position:static;border-top:0;padding:4px 0}
.ptab td,.ptab th{padding:8px 6px}
.code{line-height:1.5}
p.code{margin:6px 0}
fieldset.exs{background:var(--bg);border-color:transparent}
details.excard{border-radius:10px}

/* ===== صفحتا الإعداد والعمل ===== */
.cpart{border-top:1px dashed var(--line);padding-top:10px}.cpart h4{margin:0 0 6px;font-size:14px}
.dutyui{display:grid;gap:8px}.dutyui textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--ink)}
.dutyui select{width:auto;min-width:0;max-width:260px}
.spane .grid{grid-template-columns:minmax(0,1fr)}
.spane .card .cpart .sgrid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.sg2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.topbar h1{font-size:18px;margin:0}
.topbar #project{min-width:0;width:auto;max-width:320px}
.topbar .sp,.sfoot .sp{flex:1}
.acct{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.linkbtn{background:none;border:0;color:var(--accent);padding:0;font-weight:500;font-size:13px}
.btn2{background:transparent;color:var(--accent);border:1px solid var(--accent);padding:7px 14px}
.btn2.sm{padding:4px 12px;font-size:13px}
.setup{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}
.rail{display:flex;flex-direction:column;gap:2px;position:sticky;top:76px}
.rail .rt{font-size:13px;color:var(--muted);margin:0 0 6px}
.rstep{display:flex;align-items:center;gap:10px;background:transparent;color:var(--ink);border:0;border-radius:8px;padding:10px 12px;font-weight:500;text-align:start}
.rstep:hover{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.rstep .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;border:1.5px solid var(--line);color:var(--muted);flex:none}
.rstep.done .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rstep.cur{background:var(--surface);box-shadow:inset -3px 0 0 var(--accent)}
.rstep.cur .n{border-color:var(--accent);color:var(--accent)}
.rstep.done.cur .n{color:var(--accent-ink)}
.rstep .l{flex:1}
.rstep .s{font-size:12px;color:var(--muted)}.rstep .s.w{color:var(--warn);font-weight:600}
.rsep{border-top:1px solid var(--line);margin:12px 0 6px}
.spane{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.shead{padding:22px 24px 4px}.shead h2{margin:0;font-size:22px}.shead p{margin:4px 0 0;color:var(--muted);font-size:14px}
.sstep{padding:0 6px}
.spane details.panel{border:0;background:transparent}
.spane details.panel > summary{display:none}
.spane details.panel + details.panel{border-top:1px solid var(--line);margin-top:8px}
.spane .group{padding:0 18px}
.spane .bar{padding:8px 18px}
.sfoot{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:16px 24px;margin-top:14px}
.sstep[data-step="global"] details.panel > summary{display:flex}
.sstep:not([data-step="global"]) .phead > button{display:none}
.mhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.mhead h2{margin:0;font-size:26px}
.todo{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.todo .tr{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line)}.todo .tr:last-child{border:0}
.todo .dot{width:9px;height:9px;border-radius:50%;background:var(--warn);flex:none}.todo .dot.ok{background:var(--accent)}
.todo .tx{flex:1}
.tab .k{font-size:12px;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn);border-radius:999px;padding:1px 8px;margin-inline-start:6px}
#page-work .tabpane .sgrid > div:has(> .mpick),#page-work .tabpane .phead > .mpick{display:none}
#page-work{display:grid;gap:16px}
#page-work[hidden],#page-setup[hidden]{display:none}
@media (max-width:760px){.setup{grid-template-columns:1fr}.rail{position:static;flex-direction:row;overflow-x:auto}.rail .rt,.rail .rsep{display:none}.rstep .s{display:none}.rstep{white-space:nowrap}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.btab{table-layout:fixed;min-width:640px}
.btab td{padding-inline:4px}
.btab input,.btab select{min-width:0;max-width:100%;box-sizing:border-box}
.btab input[type=number]{padding-inline:6px}
.btab textarea{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:38px;resize:vertical;field-sizing:content;line-height:1.4}
.btab td.bname div{margin-bottom:6px;line-height:1.5}
.btab .num{text-align:end;white-space:nowrap}
.btab tr.bsec td{background:var(--bg);font-weight:700;padding-top:12px;padding-bottom:12px}
.btab tr.bline td{font-weight:600;color:var(--muted);border-bottom:1px dashed var(--line)}
</style>
</head>
<body>
<div class="topbar">
  <h1>التوثيقات المالية <span id="syncStatus" class="code"></span></h1>
  <label class="vh" for="project">المشروع</label>
  <select id="project"><option value="">جارٍ تحميل المشاريع…</option></select>
  <span class="sp"></span>
  <span class="acct"><span id="acctEmail"></span> <button type="button" class="linkbtn" id="switchAcct">تغيير الحساب</button></span>
  <button type="button" class="linkbtn" data-step-go="people">دليل الأشخاص</button>
  <button type="button" class="btn2" id="modeBtn">⚙ إعداد المشروع</button>
</div>
<div class="wrap">
  <div id="snacks" aria-live="polite"><div id="busybar" class="notice" hidden></div><div id="notice" class="notice" hidden></div><div id="errbox" class="notice err" role="alert" hidden></div></div>
  <main id="page-setup" hidden>
    <div class="setup">
      <nav class="rail" id="rail" aria-label="خطوات إعداد المشروع"></nav>
      <section class="spane">
        <div class="shead"><h2 id="stepTitle"></h2><p id="stepDesc"></p></div>
        <div class="sstep" data-step="basics"><div id="projBasics"></div><div id="settings"></div></div>
        <div class="sstep" data-step="budget"><div id="budgetBox"></div></div>
        <div class="sstep" data-step="docs"><div id="projDocs"></div></div>
        <div class="sstep" data-step="people"><div id="peopleBox"></div></div>
        <div class="sstep" data-step="staff"><div id="content"><p class="empty">جارٍ التحميل…</p></div>
          <div class="bar"><span id="allmsg" class="msg" aria-live="polite"></span><button type="button" id="saveAll">حفظ بطاقات الموظفين</button></div></div>
        <div class="sstep" data-step="global"><div id="actBox"></div><div id="dutiesBox"></div></div>
        <div class="sfoot"><button type="button" class="btn2" id="stepPrev"></button><span class="sp"></span><button type="button" id="stepNext"></button></div>
      </section>
    </div>
  </main>
  <main id="page-work">
    <div class="mhead" id="workHead"></div>
    <div id="todo"></div>
    <nav class="tabs" role="tablist" id="workTabs"></nav>
    <section id="tab-staff" class="tabpane"><div id="tsBox"></div><div id="prBox"></div><div id="docBoxPay"></div></section>
    <section id="tab-exp" class="tabpane" hidden><div id="exBox"></div><div id="docBoxEx"></div></section>
    <section id="tab-docs" class="tabpane" hidden><div id="docList"></div></section>
    <section id="tab-rep" class="tabpane" hidden><div id="repBox"></div></section>
  </main>
</div>
<script>window.APP_VERSION = "1794825872";</script>
<script src="config.js?v=1794767799"></script>

function notice(text, isErr){
  if(isErr && text){
    const b = $("#errbox"); b.hidden = false;
    b.innerHTML = `<div class="row"><strong>حدث خطأ — ${new Date().toLocaleTimeString("ar")}</strong><button type="button" class="x" data-closeerr>إغلاق</button></div><div style="user-select:text">${esc(text)}</div>`;
    return;
  }
  const n = $("#notice");
  clearTimeout(notice.t);
  if(!text){ n.hidden = true; return; }
  n.hidden = false; n.textContent = text; n.className = "notice" + (isErr ? " err" : "");
  notice.t = setTimeout(() => { n.hidden = true; }, 6000);
}
/* زر يعمل: يتعطّل ويُظهر مؤشراً وشريطاً سفلياً حتى ينتهي العمل */
let busyN = 0;
function busy(btn, run){
  const label = (btn.textContent || "").trim();
  btn.disabled = true; btn.classList.add("busy"); btn.setAttribute("aria-busy", "true");
  busyN++; const bar = $("#busybar"); bar.hidden = false; bar.textContent = `جارٍ العمل: ${label}… يمكنك متابعة التصفح، وستظهر النتيجة عند الانتهاء.`;
  const done = () => { btn.disabled = false; btn.classList.remove("busy"); btn.removeAttribute("aria-busy"); if(--busyN <= 0){ busyN = 0; bar.hidden = true; if(dirty) render(); } };
  let p; try{ p = Promise.resolve(run()); }catch(err){ p = Promise.reject(err); }
  p.then(done, done); return p;
}

  if(busyN > 0 && !force){ dirty = true; return; }

  renderReport(p);
  renderDocs(p, "pay"); renderDocs(p, "ex"); renderDocList(p);

}

function nextCode(list, all){
  const used = all.map(x => x.code);
  const sorted = list.map(x => x.code).sort((a,b) => a.localeCompare(b, undefined, {numeric:true}));
  const last = sorted[sorted.length - 1] || "1.0";
  const parts = last.split(".");
  do { parts[parts.length-1] = String((+parts[parts.length-1] || 0) + 1); } while(used.includes(parts.join(".")));
  return parts.join(".");
}

  const gid = esc(g);

    <div class="alg">
      <div><label>رمز البند</label><input type="text" name="lcode" value="${esc(nextCode(list, projects[current].positions || []))}"></div>

      <div><label>المدة أو الوحدة</label><input type="text" name="lunit" placeholder="مثال: 4 أشهر"></div>

    <div class="row"><span class="msg" aria-live="polite"></span><button type="button" data-addline>إضافة البند</button></div>

async function addLine(btn){
  const box = btn.closest(".addline"), msg = box.querySelector(".msg");
  const p = projects[current], g = box.dataset.group;
  const code = F(box,"lcode").value.trim(), title = F(box,"ltitle").value.trim(), unit = F(box,"lunit").value.trim();
  msg.className = "msg err";
  if(!code || !title){ msg.textContent = "أدخل رمز البند ومسمّاه."; return; }
  if(!/^[0-9.]+$/.test(code)){ msg.textContent = "رمز البند أرقام ونقاط فقط، مثل 1.5"; return; }
  const same = (p.positions || []).filter(x => x.code === code);
  if(same.length && btn.dataset.ok !== code){
    btn.dataset.ok = code; btn.textContent = "تأكيد الإضافة";
    msg.className = "msg"; msg.textContent = `الرمز ${code} مستخدم لبند "${same[0].title}". اضغط "تأكيد الإضافة" لإضافة بند آخر بنفس الرمز.`;
    return;
  }
  delete btn.dataset.ok; btn.textContent = "إضافة البند";
  let id = code;
  if(same.length){ let n = same.length + 1; while((p.positions || []).some(x => pid(x) === code + "-" + n)) n++; id = code + "-" + n; }
  const sample = (p.positions || []).find(x => (x.group || "المناصب") === g) || {};
  const line = {code, id, title, unit, group: g, req: [...(sample.req || [])], added: true, addedAt: today()};
  const positions = [...(p.positions || []), line].sort((a,b) => a.code.localeCompare(b.code, undefined, {numeric:true}));
  btn.disabled = true;
  try{ await db.doc("projects/" + p.code).update({positions}); editing = false; render(true); }
  catch(e){ btn.disabled = false; msg.textContent = "تعذّرت إضافة البند."; }
}

async function removeLine(btn){
  if(!confirmClick(btn, "اضغط مرة أخرى لحذف البند")) return;
  const p = projects[current], id = btn.dataset.rmline, base = p.code + "__" + id;
  if(Object.keys(assignments).some(k => (k === base || k.startsWith(base + "__")) && assignments[k].personKey)){ btn.textContent = "أزل الشخص أولاً"; return; }
  const positions = (p.positions || []).filter(x => pid(x) !== id);
  btn.disabled = true;
  try{ await db.doc("projects/" + p.code).update({positions}); render(true); }
  catch(e){ btn.disabled = false; btn.textContent = "تعذّر الحذف"; }
}

async function addStaff(btn){
  const box = btn.closest("#addStaff"), msg = box.querySelector(".msg"), p = projects[current];
  const v = F(box, "spos").value;
  msg.className = "msg err";
  let posId = v;
  if(v === "__new"){
    const code = F(box,"lcode").value.trim(), title = F(box,"ltitle").value.trim();
    if(!code || !title){ msg.textContent = "أدخل رمز البند والمسمى."; return; }
    if(!/^[0-9.]+$/.test(code)){ msg.textContent = "رمز البند أرقام ونقاط فقط، مثل 1.5"; return; }
    let id = code; const same = (p.positions || []).filter(x => x.code === code);
    if(same.length){ let n = same.length + 1; while((p.positions || []).some(x => pid(x) === code + "-" + n)) n++; id = code + "-" + n; }
    const sal = F(box,"lsal").value;
    const line = {code, id, title, unit: F(box,"lunit").value.trim(), group: STAFF_GROUP, req: ["id","cv"], salary: sal ? Number(sal) : "",
      title_m: F(box,"ltm").value.trim() || title.replace("/ة",""), title_f: F(box,"ltf").value.trim() || title.replace("/ة","ة"), duties: F(box,"ldt").value, added: true, addedAt: today()};
    const positions = [...(p.positions || []), line].sort((a,b) => a.code.localeCompare(b.code, undefined, {numeric:true}));
    await db.doc("projects/" + p.code).update({positions});
    p.positions = positions; posId = id;
  }
  const base = p.code + "__" + posId;
  (extraSlots[base] ||= []).push(base);
  editing = false; render(true);
  const c = document.querySelector(`.card[data-key="${CSS.escape(base)}"]`); if(c) c.scrollIntoView({block: "center"});
}

function slotKeys(p, pos){
  const base = p.code + "__" + pid(pos);
  const keys = Object.keys(assignments).filter(k => k === base || k.startsWith(base + "__")).sort();
  (extraSlots[base] || []).forEach(k => { if(!keys.includes(k)) keys.push(k); });
  return keys;
}

const PERSON_TYPES = ["شهادة مزاولة مهنة", "شهادة علمية", "مستند شخصي آخر"];
const PROJECT_TYPES = ["Vetting", "ملحق المانح", "مستند آخر للمشروع"];
const today = () => new Date().toISOString().slice(0,10);
const dlink = (id, label) => `<a href="https://drive.google.com/file/d/${esc(id)}/view" target="_blank" rel="noopener">${esc(label)}</a>`;

const pid = pos => pos.id || pos.code;

function isReq(pos, kind){ return (pos.req || []).includes(kind); }

function expNote(d, p){
  if(!d.expiry) return "";
  if(d.expiry < today()) return ` <span class="pill err">منتهي ${esc(d.expiry)}</span>`;
  if(p.end && d.expiry < p.end) return ` <span class="pill err">ينتهي ${esc(d.expiry)} قبل نهاية المشروع</span>`;
  return ` <span class="code">حتى ${esc(d.expiry)}</span>`;
}

function personInfo(key, p, a, akey){
  const v = people[key]; if(!v) return "";
  const link = (id, label) => id ? dlink(id, label) : `<span>${label}: غير موجودة</span>`;
  let h = `<div class="current">${link(v.idFileId, "الهوية")} · ${link(v.cvFileId, "السيرة الذاتية")}</div>`;
  const del = ref => ` <button type="button" class="x" data-del="${esc(ref)}" title="حذف المستند">حذف</button>`;
  const docs = (v.docs || []).map((d, i) => `<li>${dlink(d.fileId, d.type)} <span class="code">(ثابت)</span>${expNote(d, p)}${del("person|" + key + "|" + i)}</li>`)
    .concat(((a && a.personKey === key && a.docs) || []).map((d, i) => `<li>${dlink(d.fileId, d.type)} <span class="code">(هذا المشروع)</span>${expNote(d, p)}${del("assign|" + akey + "|" + i)}</li>`));
  if(docs.length) h += `<ul class="docs">${docs.join("")}</ul>`;
  if(v.review) h += `<div class="review">${esc(v.review)}</div>`;
  return h;
}

function chips(pk, pos, p, a){
  const v = people[pk];
  if(!v) return `<span class="pill">فارغ</span>`;
  const chip = (has, label, req) => `<span class="pill ${has ? "read" : (req ? "err" : "")}">${label} ${has ? "✓" : "✗"}</span>`;
  let h = chip(!!v.idFileId, "الهوية", isReq(pos,"id")) + chip(!!v.cvFileId, "السيرة", isReq(pos,"cv"));
  const projDocs = (a && a.personKey === pk && a.docs) || [];
  (p.projRequired || []).forEach(t => { h += chip(projDocs.some(d => d.type === t), t, true); });
  const allDocs = (v.docs || []).concat(projDocs);
  if(allDocs.some(d => d.expiry && (d.expiry < today() || (p.end && d.expiry < p.end)))) h += `<span class="pill err">صلاحية مستند</span>`;
  if(v.review) h += `<span class="pill err" title="${esc(v.review)}">يحتاج مراجعة</span>`;
  else if(v.status === "read") h += `<span class="pill read">تم التحقق</span>`;
  return `<span class="chips">${h}</span>`;
}

function xrow(){
  const opts = list => list.map(t => `<option>${esc(t)}</option>`).join("");
  return `<div class="xrow">

      <optgroup label="خاص بهذا المشروع">${opts(PROJECT_TYPES)}</optgroup>

}

function card(p, pos, key, idx, total){
  const a = assignments[key] || {};
  const sel = a.personKey || "";
  const c = esc(pos.code), k = esc(key), pi = esc(pid(pos));
  const star = t => isReq(pos,t) ? ` <span class="req">*</span>` : ` <span class="code">(اختياري)</span>`;
  const nth = total > 1 ? ` · الشخص ${idx + 1}` : "";
  return `<div class="card" data-pos="${pi}" data-key="${k}">
    <div class="card-head"><div><div class="title">${esc(pos.title)}</div><div class="code">بند ${c}${pos.unit ? " · " + esc(pos.unit) : ""}${nth}${pos.added ? ` · <span class="pill">مضاف خارج الموازنة الأصلية</span> <button type="button" class="x" data-rmline="${pi}">حذف البند</button>` : ""}</div></div>${chips(sel, pos, p, a)}</div>
    <div><label for="s-${k}">الشخص</label>
      <select id="s-${k}" name="person">${personOptions(sel)}</select></div>
    <div class="info"></div>
    <div class="newp" hidden>
      <label for="n-${k}">الاسم الكامل</label>
      <input type="text" id="n-${k}" name="pname" placeholder="الاسم الثلاثي كما في الهوية">
    </div>
    <div class="file up-id" hidden><label for="f-${k}" style="margin:0"><span class="lbl-id">صورة الهوية</span>${star("id")}</label>
      <input type="file" id="f-${k}" name="file" accept="image/jpeg,image/png,application/pdf"></div>
    <div class="file up-cv" hidden><label for="c-${k}" style="margin:0"><span class="lbl-cv">السيرة الذاتية</span>${star("cv")}</label>
      <input type="file" id="c-${k}" name="cv" accept="application/pdf,.doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/jpeg,image/png"></div>
    <details class="extra" hidden><summary>إضافة مستندات أخرى</summary>
      <div class="xrows">${xrow()}</div>
      <button type="button" class="ghost" data-addrow>+ مستند آخر</button>
    </details>
    ${contractBox(p, pos, a)}
    <div class="row">
      <span class="msg" aria-live="polite"></span>
      ${a.personKey ? `<button type="button" class="x" data-unassign="${k}">إزالة الموظف</button>` : `<button type="button" class="x" data-dropslot="${k}">إلغاء</button>`}
    </div>
  </div>`;
}

const F = (card, n) => card.querySelector(`[name="${n}"]`);

function syncCard(form){
  const k = F(form,"person").value;
  const isNew = k === "__new";
  const v = people[k];
  const p = projects[current];
  const akey = form.dataset.key;
  const a = assignments[akey];
  const pos = (p.positions || []).find(x => pid(x) === form.dataset.pos) || {};
  const replace = form.dataset.replace === "1";
  form.querySelector(".newp").hidden = !isNew;
  form.querySelector(".up-id").hidden = !(isNew || (v && (!v.idFileId || replace)));
  form.querySelector(".up-cv").hidden = !(isNew || (v && (!v.cvFileId || replace)));
  form.querySelector(".lbl-id").textContent = v && v.idFileId ? "استبدال الهوية" : "صورة الهوية";
  form.querySelector(".lbl-cv").textContent = v && v.cvFileId ? "استبدال السيرة الذاتية" : "السيرة الذاتية";
  form.querySelector(".extra").hidden = !(isNew || v);
  const head = form.querySelector(".card-head > .chips, .card-head > .pill");
  if(head) head.outerHTML = chips(isNew ? "" : k, pos, p, a);
  const info = isNew ? "" : personInfo(k, p, a, akey);
  const canReplace = v && (v.idFileId || v.cvFileId);
  form.querySelector(".info").innerHTML = info + (canReplace ? `<button type="button" class="x" data-replace>${replace ? "إخفاء الاستبدال" : "استبدال الهوية أو السيرة"}</button>` : "");
}

function readB64(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(",")[1]);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(file);
  });
}

function errDetail(e){
  if(!e) return "";
  const parts = [e.code, e.message, e.server].filter(Boolean).map(String);
  try{ if(e.result) parts.push(JSON.stringify(e.result).slice(0, 300)); }catch(_){}
  return parts.length ? " [" + parts.join(" | ").slice(0, 600) + "]" : "";
}
function mcpMessage(e){
  switch(e && e.code){
    case "needs_reauth": return "انتهى ربط Google Drive. أعد ربطه من إعدادات claude.ai ← Connectors.";
    case "server_not_connected": return "Google Drive غير مربوط بحسابك. اربطه من إعدادات claude.ai ← Connectors.";
    case "not_in_manifest": return "لم يُسمح لهذه الصفحة باستخدام Google Drive. اسمح لها ثم أعد المحاولة.";
    case "approval_required": return "الرفع يحتاج موافقتك. اضغط حفظ مرة أخرى ووافق على الطلب.";
    case "server_unavailable": return "Google Drive لا يستجيب الآن. تأكد من الدرايف قبل إعادة المحاولة، فقد يكون الملف رُفع.";
    case "tool_error": return "رفض Google Drive الطلب: " + (e.message || "");
    default: return "تعذّر رفع الملف. قد يكون رُفع فعلاً؛ تحقق من الدرايف قبل إعادة المحاولة." + (e && e.code ? ` (${e.code}${e.message ? ": " + String(e.message).slice(0,160) : ""})` : "");
  }
}

async function upload(f, folder, base){
  if(!mcp){ throw {code:"no_mcp"}; }
  const ext = (f.name.split(".").pop() || "bin").toLowerCase();
  const title = `${base}.${ext}`;
  const type = f.type || "application/octet-stream";
  const call = async content => {
    const r = await mcp.callTool("Google Drive", "create_file", {
      title, parentId: folder, contentMimeType: type, disableConversionToGoogleType: true, base64Content: content });
    let pl = r.payload;
    if(typeof pl === "string"){ try{ pl = JSON.parse(pl); }catch(_){} }
    return {id: (pl && pl.id) || "", title: (pl && pl.title) || title};
  };
  if(fileArgs){
    try{ return await call({$file:{data:f, name:f.name, type}}); }
    catch(e){
      const fallback = ["bad_request","capability_disabled","transform_error"].includes(e && e.code) && f.size <= INLINE_LIMIT;
      if(!fallback) throw e;
    }
  }
  if(f.size > INLINE_LIMIT){ throw {code:"too_big"}; }
  return await call(await readB64(f));
}

function checkFiles(id, cv){
  if(id && cv && id.name === cv.name && id.size === cv.size) return "اخترت نفس الملف للهوية والسيرة الذاتية. تأكد من الملفين.";
  if(id){
    if(/\.(docx?|odt)$/i.test(id.name)) return "ملف Word لا يكون صورة هوية. هل وضعت السيرة الذاتية في حقل الهوية؟";
    if(/(cv|resume|سيرة)/i.test(id.name)) return `اسم الملف "${id.name}" يوحي بأنه سيرة ذاتية، لكنه في حقل الهوية. تأكد منه.`;
  }
  if(cv && /(^|[^a-z])(id|identity|هوية)([^a-z]|$)/i.test(cv.name)) return `اسم الملف "${cv.name}" يوحي بأنه هوية، لكنه في حقل السيرة الذاتية. تأكد منه.`;
  return "";
}

async function trash(fileId){

}

  armed.add(id); btn.textContent = label; btn.classList.add("armed");

async function saveCard(form){
  const posCode = form.dataset.pos;
  const p = projects[current];
  const pos = (p.positions || []).find(x => pid(x) === posCode);
  let cres;
  try{ cres = await saveCardContract(form, p, pos); }catch(e){ const m0 = form.querySelector(".msg"); m0.className = "msg err"; m0.textContent = "تعذّر حفظ بيانات البند أو المهام."; return "err"; }
  const msg = form.querySelector(".msg");
  const fail = t => { msg.className = "msg err"; msg.textContent = t; return "err"; };
  msg.className = "msg"; msg.textContent = "";
  let pk = F(form,"person").value;
  const isNew = pk === "__new";
  const name = isNew ? F(form,"pname").value.trim() : (people[pk] && people[pk].name) || "";
  const file = F(form,"file").files[0];
  const cv = F(form,"cv").files[0];
  const rows = [...form.querySelectorAll(".xrow")].map(r => ({type: F(r,"xtype").value, exp: F(r,"xexp").value, file: F(r,"xfile").files[0]}))
    .filter(r => r.type || r.file);
  const key = form.dataset.key;
  const prevA = assignments[key] || {};
  if(!pk) return cres.changed ? "ok" : "skip";
  if(!isNew && !file && !cv && !rows.length && prevA.personKey === pk) return cres.changed ? "ok" : "skip";
  if(isNew && !name) return fail("أدخل اسم الشخص الجديد.");
  if(isNew && Object.values(people).some(v => (v.name||"").replace(/\s+/g," ") === name.replace(/\s+/g," ")))
    return fail("هذا الاسم موجود في القائمة. اختره منها بدل إضافته من جديد.");
  const v0 = isNew ? {} : people[pk];
  if(isReq(pos,"id") && !v0.idFileId && !file) return fail("صورة الهوية إلزامية لهذا المنصب.");
  if(isReq(pos,"cv") && !v0.cvFileId && !cv) return fail("السيرة الذاتية إلزامية لهذا المنصب.");
  if(isNew && !file) return fail("ارفع صورة الهوية للشخص الجديد.");
  if(rows.some(r => r.file && !r.type)) return fail("اختر نوع كل مستند إضافي.");
  if(rows.some(r => r.type && !r.file)) return fail("اختر ملفاً لكل مستند إضافي حددت نوعه.");
  if(!db) return fail("الحفظ غير متاح في هذا العرض.");
  const bad = checkFiles(file, cv) || rows.map(r => checkExtra(r.file, r.type, file, cv)).find(Boolean);
  if(bad) return fail(bad);
  try{
    const person = isNew ? {name, nameEn:"", nid:"", idFileId:"", cvFileId:"", status:"pending", docs:[]} : {...people[pk], docs:[...(people[pk].docs || [])]};
    if(isNew) pk = "new-" + Date.now().toString(36);
    const safe = name.replace(/[\\/:*?"<>|]/g, " ").trim();
    const rec = {project:p.code, posCode:pos.code, posId:pid(pos), title:pos.title, personKey:pk, name,
                 folderId: prevA.personKey === pk ? (prevA.folderId || "") : "",
                 docs: prevA.personKey === pk ? [...(prevA.docs || [])] : [], duties: cres.dl, updatedAt:new Date().toISOString()};
    let personChanged = isNew;
    if(file){
      msg.textContent = "جارٍ رفع الهوية…";
      const r = await upload(file, FOLD.ids, `ID_${safe}`);
      const old = person.idFileId;
      person.idFileId = r.id; person.idFileName = r.title; personChanged = true;
      if(old){ person.status = "pending"; person.review = ""; await trash(old); }
    }
    if(cv){
      msg.textContent = "جارٍ رفع السيرة الذاتية…";
      const r = await upload(cv, FOLD.cvs, `CV_${safe}`);
      const old = person.cvFileId;
      person.cvFileId = r.id; person.cvFileName = r.title; personChanged = true;
      if(old){ person.status = "pending"; person.review = ""; await trash(old); }
    }
    for(const row of rows){
      msg.textContent = `جارٍ رفع ${row.type}…`;
      const doc = {type: row.type, expiry: row.exp || "", addedAt: today()};
      if(PERSON_TYPES.includes(row.type)){
        const r = await upload(row.file, FOLD.personDocs, `${row.type}_${safe}`);
        doc.fileId = r.id; doc.fileName = r.title;
        person.docs.push(doc); personChanged = true;
      } else {
        if(!rec.folderId){
          const fr = await mcp.callTool("Google Drive", "create_file", {
            title: `${pos.code} - ${name}`, parentId: (p.folders || {}).staff, contentMimeType: "application/vnd.google-apps.folder"});
          let pl = fr.payload; if(typeof pl === "string"){ try{ pl = JSON.parse(pl); }catch(_){} }
          rec.folderId = (pl && pl.id) || "";
          if(!rec.folderId) throw {code:"tool_error", message:"لم يُنشأ مجلد الشخص."};
        }
        const r = await upload(row.file, rec.folderId, `${row.type}_${safe}`);
        doc.fileId = r.id; doc.fileName = r.title;
        rec.docs.push(doc);
      }
    }
    if(personChanged) await db.doc("people/" + pk).set(person);
    rec.status = person.status === "read" ? "read" : (person.idFileId ? "uploaded" : "saved");
    await db.doc("assignments/" + key).set(rec);
    msg.className = "msg ok"; msg.textContent = "تم الحفظ.";
    return "ok";
  }catch(e){
    msg.className = "msg err";
    if(e && e.code === "too_big") msg.textContent = "حجم الملف كبير. صغّره إلى أقل من 700 كيلوبايت أو ارفعه إلى الدرايف مباشرة.";
    else if(e && e.code === "no_mcp") msg.textContent = "رفع الملفات غير متاح هنا. افتح الصفحة من claude.ai.";
    else if(e && e.code === "quota_exceeded") msg.textContent = "امتلأت مساحة الحفظ في الصفحة.";
    else if(e && e.code === "invalid_argument") msg.textContent = "ليست لديك صلاحية الحفظ في هذه الصفحة.";
    else msg.textContent = mcpMessage(e);
    return "err";
  }
}

const ONES=["","واحد","اثنان","ثلاثة","أربعة","خمسة","ستة","سبعة","ثمانية","تسعة","عشرة","أحد عشر","اثنا عشر","ثلاثة عشر","أربعة عشر","خمسة عشر","ستة عشر","سبعة عشر","ثمانية عشر","تسعة عشر"];
const TENS=["","","عشرون","ثلاثون","أربعون","خمسون","ستون","سبعون","ثمانون","تسعون"];
const HUND=["","مائة","مائتان","ثلاثمائة","أربعمائة","خمسمائة","ستمائة","سبعمائة","ثمانمائة","تسعمائة"];
function b1000(n){ const r=[]; if(n>=100){ r.push(HUND[Math.floor(n/100)]); n%=100; }
  if(n){ if(n<20) r.push(ONES[n]); else { const o=n%10,t=Math.floor(n/10); r.push((o?ONES[o]+" و":"")+TENS[t]); } } return r.join(" و"); }
function words(n){ n=Math.round(n); if(!n) return "صفر"; const r=[]; const m=Math.floor(n/1e6); n%=1e6; const th=Math.floor(n/1000), rest=n%1000;
  if(m) r.push(m===1?"مليون":m===2?"مليونان":(m<=10?b1000(m)+" ملايين":b1000(m)+" مليون"));
  if(th) r.push(th===1?"ألف":th===2?"ألفان":(th<=10?b1000(th)+" آلاف":b1000(th)+" ألف"));
  if(rest) r.push(b1000(rest)); return r.join(" و"); }
const MONTHS={1:"شهر واحد",2:"شهران",3:"ثلاثة أشهر",4:"أربعة أشهر",5:"خمسة أشهر",6:"ستة أشهر",7:"سبعة أشهر",8:"ثمانية أشهر",9:"تسعة أشهر",10:"عشرة أشهر",11:"أحد عشر شهراً",12:"اثنا عشر شهراً"};
const gw = (gd, m, f) => gd === "f" ? f : m;
const shortName = v => v.shortName || (() => { const t=(v.name||"").trim().split(/\s+/); return t.length>1 ? t[0]+" "+t[t.length-1] : (v.name||""); })();
const xmlEsc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

const DOCX_T = "application/vnd.openxmlformats-officedocument.wordprocessingml.document";
const editLink = id => `<a href="https://docs.google.com/document/d/${esc(id)}/edit" target="_blank" rel="noopener">تعديل Word</a>`;
async function wordToPdf(wordId, folder, base){
  const r = await mcp.callTool("Google Drive", "download_file_content", {fileId: wordId});
  const b64 = findB64(r, 0).replace(/\s/g, ""); if(!b64) throw {code:"tool_error", message:"تعذّر تحميل ملف Word من الدرايف."};
  const gr = await mcp.callTool("Google Drive", "create_file", {title: base + " (مؤقت)", parentId: folder, contentMimeType: DOCX_T, base64Content: b64});
  const gid = payloadId(gr);
  try{
    const ex = await mcp.callTool("Google Drive", "download_file_content", {fileId: gid, exportMimeType: "application/pdf"});
    const p64 = findB64(ex, 0); if(!p64) throw {code:"tool_error", message:"تعذّر تحويل العقد إلى PDF."};
    return await upload(new File([b64ToBlob(p64, "application/pdf")], base + ".pdf", {type: "application/pdf"}), folder, base);
  } finally { if(gid) await trash(gid).catch(() => {}); }
}

function findB64(o, depth){
  if(depth > 6 || o == null) return "";
  if(typeof o === "string") return (o.length > 200 && /^[A-Za-z0-9+/=\s]+$/.test(o.slice(0, 400))) ? o : "";
  if(typeof o === "object"){ for(const k of Object.keys(o)){ const r = findB64(o[k], depth + 1); if(r) return r; } }
  return "";
}
function payloadId(r){ let pl = r.payload; if(typeof pl === "string"){ try{ pl = JSON.parse(pl); }catch(_){} } return pl && pl.id; }
function b64ToBlob(b64, type){ const bin = atob(b64.replace(/\s/g,"")); const u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u], {type}); }

async function loadTemplate(){
  if(tplCache && tplCache.id === templates.contract) return tplCache.xml;
  if(!templates.contract) throw {code:"tool_error", message:"لم يُحدد قالب العقد."};
  const r = await mcp.callTool("Google Drive", "download_file_content", {fileId: templates.contract});
  const b64 = findB64(r, 0);
  if(!b64) throw {code:"tool_error", message:"تعذّرت قراءة قالب العقد من الدرايف."};
  const zip = await JSZip.loadAsync(b64.replace(/\s/g,""), {base64:true});
  tplCache = {id: templates.contract, b64: b64.replace(/\s/g,""), xml: await zip.file("word/document.xml").async("string")};
  return tplCache.xml;
}

function fillXml(xml, v){
  let x = xml;
  for(const [k, t] of Object.entries(v.tags)) x = x.split("{{" + k + "}}").join(xmlEsc(t));
  const i = x.indexOf("{{DUTY}}");
  if(i >= 0){
    const st = Math.max(x.lastIndexOf("<w:p ", i), x.lastIndexOf("<w:p>", i)), en = x.indexOf("</w:p>", i) + 6;
    const para = x.slice(st, en);
    x = x.slice(0, st) + v.duties.map(d => para.split("{{DUTY}}").join(xmlEsc(d))).join("") + x.slice(en);
  }
  return x;
}

function projMonths(p){
  if(!p.start || !p.end) return [];
  const [sy, sm] = p.start.split("-").map(Number);
  const e = new Date(p.end + "T00:00:00Z"); e.setUTCDate(e.getUTCDate() - 1);
  const out = []; let y = sy, m = sm;
  while(y < e.getUTCFullYear() || (y === e.getUTCFullYear() && m <= e.getUTCMonth() + 1)){ out.push(`${y}-${String(m).padStart(2,"0")}`); m++; if(m > 12){ m = 1; y++; } }
  return out;
}

    return v ? {pos, a, v, id: pid(pos)} : null;

}
function dayGrid(name, y, m, weekend, selected, disabled){

  for(let d = 1; d <= dim; d++){
    const wd = (first + d - 1) % 7, wk = weekend.includes(wd), dis = wk || (disabled || []).includes(d);
    h += `<button type="button" class="dday${selected.includes(d) ? " on" : ""}${wk ? " wkend" : ""}" data-day="${d}" ${dis ? "disabled" : ""} aria-pressed="${selected.includes(d)}" title="${DAY_AR[wd]} ${d}">${d}</button>`;

function monthPick(sec, val, all){

/* القوالب المحفوظة من Excel تضع النصوص في sharedStrings؛ نحوّلها إلى نصوص داخل الورقة ليعمل الملء */
async function sheetXml(zip){
  let x = await zip.file("xl/worksheets/sheet1.xml").async("string");
  const sf = zip.file("xl/sharedStrings.xml"); if(!sf || !/ t="s"/.test(x)) return x;
  const si = [...(await sf.async("string")).matchAll(/<si>([\s\S]*?)<\/si>|<si\/>/g)].map(m => m[1] || "<t></t>");
  return x.replace(/<c ([^>]*?)t="s"([^>]*)>\s*<v>(\d+)<\/v>\s*<\/c>/g, (all, a, b, n) => si[+n] === undefined ? all : `<c ${a}t="inlineStr"${b}><is>${si[+n].replace(/<rPh\b[\s\S]*?<\/rPh>|<phoneticPr[^>]*\/>/g, "")}</is></c>`);
}
async function loadTsTemplate(){
  if(tsTpl && tsTpl.id === templates.timesheet) return tsTpl;

function setCell(xml, ref, val){
  const re = new RegExp(`<c r="${ref}"([^>]*?)(?:/>|>[\\s\\S]*?</c>)`);
  return xml.replace(re, (all, attrs) => {
    const sm = attrs.match(/ s="(\d+)"/); const sAttr = sm ? ` s="${sm[1]}"` : "";
    if(val === null || val === undefined || val === "") return `<c r="${ref}"${sAttr}/>`;
    if(typeof val === "number") return `<c r="${ref}"${sAttr}><v>${val}</v></c>`;
    return `<c r="${ref}"${sAttr} t="inlineStr"><is><t>${xmlEsc(val)}</t></is></c>`;
  });
}
/* مثل setCell لكن يُنشئ الخلية (والصف) إذا لم تكن موجودة */
function putCell(xml, ref, val){
  if(new RegExp(`<c r="${ref}"[ >/]`).test(xml)) return setCell(xml, ref, val);
  if(val === null || val === undefined || val === "") return xml;
  const [, col, row] = ref.match(/^([A-Z]+)(\d+)$/), cn = c => [...c].reduce((n, ch) => n * 26 + ch.charCodeAt(0) - 64, 0);
  const cell = typeof val === "number" ? `<c r="${ref}"><v>${val}</v></c>` : `<c r="${ref}" t="inlineStr"><is><t>${xmlEsc(val)}</t></is></c>`;
  const rm = xml.match(new RegExp(`<row r="${row}"[^>]*?(?:/>|>([\\s\\S]*?)</row>)`));
  if(rm){
    const inner = rm[1] || "", cells = [...inner.matchAll(/<c r="([A-Z]+)\d+"[\s\S]*?(?:\/>|<\/c>)/g)];
    const after = cells.find(c => cn(c[1]) > cn(col));
    const ninner = after ? inner.slice(0, after.index) + cell + inner.slice(after.index) : inner + cell;
    const open = rm[0].replace(/\/?>[\s\S]*$/, "").replace(/\/$/, "");
    return xml.replace(rm[0], `${open}>${ninner}</row>`);
  }
  const rows = [...xml.matchAll(/<row r="(\d+)"/g)], nxt = rows.find(m => +m[1] > +row);
  const nr = `<row r="${row}">${cell}</row>`;
  return nxt ? xml.slice(0, nxt.index) + nr + xml.slice(nxt.index) : xml.replace("</sheetData>", nr + "</sheetData>");
}

/* تكبير ارتفاع الصفوف لتملأ الصفحة عند التحويل */
function stretchRows(xml, maxRow, f){
  return xml.replace(/<row r="(\d+)"([^>]*)>/g, (all, r, attrs) => {
    if(+r > maxRow) return all;
    const m = attrs.match(/ ht="([\d.]+)"/), ht = m ? +m[1] : 15;
    const a = attrs.replace(/ ht="[\d.]+"/, "").replace(/ customHeight="\d"/, "");
    return `<row r="${r}"${a} ht="${(ht * f).toFixed(2)}" customHeight="1">`;
  });
}
/* أعمدة أيام الشهر بعرض موحّد */
function uniformCols(xml, from, to, width){
  return xml.replace(/<cols>([\s\S]*?)<\/cols>/, (all, inner) => {
    const cols = [...inner.matchAll(/<col ([^>]*)\/>/g)].map(m => m[1]);
    const out = [];
    cols.forEach(a => { const mn = +(a.match(/min="(\d+)"/) || [])[1], mx = +(a.match(/max="(\d+)"/) || [])[1];
      if(mx < from || mn > to){ out.push(`<col ${a}/>`); return; }
      if(mn < from) out.push(`<col ${a.replace(/max="\d+"/, `max="${from - 1}"`)}/>`);
      if(mx > to) out.push(`<col ${a.replace(/min="\d+"/, `min="${to + 1}"`)}/>`); });
    out.push(`<col min="${from}" max="${to}" width="${width}" customWidth="1"/>`);
    out.sort((a, b) => +a.match(/min="(\d+)"/)[1] - +b.match(/min="(\d+)"/)[1]);
    return `<cols>${out.join("")}</cols>`;
  });
}

function fillTs(xml, d){
  let x = xml;
  const rep = {NAME: d.name, POSITION: d.position, MONTH_EN: MON_EN[d.m-1], MONTH_AR: MON_AR[d.m-1], YEAR: String(d.y), PROJECT: d.project, NOTES: d.notes};
  for(const [k, v] of Object.entries(rep)) x = x.split("{{" + k + "}}").join(xmlEsc(v));
  for(let day = 1; day <= 31; day++){
    const c = colL(4 + day);
    if(day > d.dim){ for(const r of [7,8,9,10,11]) x = setCell(x, c + r, null); continue; }
    const serial = (Date.UTC(d.y, d.m-1, day) - Date.UTC(1899, 11, 30)) / 86400000;
    const wd = new Date(Date.UTC(d.y, d.m-1, day)).getUTCDay();
    x = setCell(x, c + "7", serial);
    if(d.weekend.includes(wd)){ x = setCell(x, c+"8", 0); x = setCell(x, c+"9", null); x = setCell(x, c+"10", null); x = setCell(x, c+"11", null); continue; }
    x = setCell(x, c+"8", d.hours);
    const isH = d.hol.includes(day), isL = !isH && d.leave.includes(day);
    x = setCell(x, c+"9", isH || isL ? 0 : d.hours);
    x = setCell(x, c+"10", isH ? d.hours : null);
    x = setCell(x, c+"11", isL ? d.hours : null);
  }
  return x;
}

/* إعدادات التحويل إلى PDF تُقرأ من القالب نفسه (الاتجاه، الملاءمة، الهوامش، منطقة الطباعة، التوسيط) */
async function pageOf(tpl){
  if(tpl.page) return tpl.page;
  const zip = await JSZip.loadAsync(tpl.b64, {base64:true});
  const sx = await zip.file("xl/worksheets/sheet1.xml").async("string"), wb = await zip.file("xl/workbook.xml").async("string");
  const tag = n => (sx.match(new RegExp(`<${n}\\b[^>]*>`)) || [""])[0], at = (t, n) => { const m = t.match(new RegExp(`\\b${n}="([^"]*)"`)); return m ? m[1] : null; };
  const ps = tag("pageSetup"), pm = tag("pageMargins"), po = tag("printOptions");
  const fit = /<pageSetUpPr\b[^>]*fitToPage="(1|true)"/.test(sx);
  const fw = +(at(ps, "fitToWidth") ?? 1), fh = +(at(ps, "fitToHeight") ?? 1);
  const o = {portrait: at(ps, "orientation") !== "landscape", scale: !fit ? (+(at(ps, "scale") || 100) < 100 ? 2 : 1) : (fw && fh ? 4 : fw ? 2 : fh ? 3 : 1),
    size: at(ps, "paperSize") === "1" ? "letter" : "A4", margins: ["top", "bottom", "left", "right"].map(k => at(pm, k)),
    hcenter: /horizontalCentered="(1|true)"/.test(po), vcenter: /verticalCentered="(1|true)"/.test(po), gridlines: /gridLines="(1|true)"/.test(po)};
  const dn = [...wb.matchAll(/<definedName\b([^>]*)>([^<]*)<\/definedName>/g)].find(m => /_xlnm\.Print_Area/.test(m[1]) && /localSheetId="0"/.test(m[1]));
  const rg = dn && dn[2].match(/\$?([A-Z]+)\$?(\d+):\$?([A-Z]+)\$?(\d+)/);
  const cn = c => [...c].reduce((n, ch) => n * 26 + ch.charCodeAt(0) - 64, 0);
  if(rg) o.range = [+rg[2] - 1, cn(rg[1]) - 1, +rg[4], cn(rg[3])];
  return tpl.page = o;
}

  const kind = btn.dataset.delmonth, p = projects[current], m = kind === "pr" ? prMonth : tsMonth, msg = $(kind === "pr" ? "#pr-msg" : "#ts-msg");
  if(!mcp){ msg.className = "msg err"; msg.textContent = "الوصول إلى Google Drive غير متاح."; return; }
  if(!confirmClick(btn, "اضغط مرة أخرى: ستُنقل الملفات إلى سلة الدرايف")) return;
  btn.disabled = true; msg.className = "msg"; msg.textContent = "جارٍ الحذف…";
  try{
    const key = p.code + "__" + m;
    if(kind === "pr"){
      const d = payrolls[key] || {}, f = d.files || {};
      for(const o of Object.values(f.vouchers || {})) await trashSet(o).catch(() => {});
      if(f.payroll) await trashSet(f.payroll).catch(() => {});
      await db.doc("payroll/" + key).set({...d, files: {}});
      const df = {...(p.docFiles || {})};
      for(const k of Object.keys(df)) if(k.startsWith(`pay:${m}:`)){ await trash(df[k].id).catch(() => {}); delete df[k]; }
      await db.doc("projects/" + p.code).set({...p, docFiles: df});
    } else {
      const d = timesheets[key] || {};
      for(const o of Object.values(d.files || {})) await trashSet(o).catch(() => {});
      await db.doc("timesheets/" + key).set({...d, files: {}});
    }
    editing = false; render(true);
    const mm = $(kind === "pr" ? "#pr-msg" : "#ts-msg"); if(mm){ mm.className = "msg ok"; mm.textContent = "تم الحذف."; }
  }catch(e){ btn.disabled = false; msg.className = "msg err"; msg.textContent = mcpMessage(e); }
}
async function deleteDocFile(btn){
  const p = projects[current], k = btn.dataset.deldoc;
  if(!confirmClick(btn, "اضغط مرة أخرى")) return;
  const df = {...(p.docFiles || {})}; if(df[k]){ if(mcp) await trash(df[k].id).catch(() => {}); delete df[k]; }
  await db.doc("projects/" + p.code).set({...p, docFiles: df}); editing = false; render(true);
}

async function trashSet(o){ if(o){ await trash(o.xlsx); if(o.pdf) await trash(o.pdf); } }

function rep(x, map){ for(const [k, v] of Object.entries(map)) x = x.split("{{" + k + "}}").join(xmlEsc(v)); return x; }

async function monthFolder(p, ym = tsMonth){
  let folder = (p.monthFolders || {})[ym];
  if(!folder){
    const fr = await mcp.callTool("Google Drive", "create_file", {title: ym, parentId: (p.folders || {}).monthly, contentMimeType: "application/vnd.google-apps.folder"});
    folder = payloadId(fr); if(!folder) throw {code:"tool_error", message:"لم يُنشأ مجلد الشهر."};
    await db.doc("projects/" + p.code).update({monthFolders: {[ym]: folder}});
  }
  return folder;
}

async function prMake(btn){
  const say = (t, err) => { const m = $("#pr-msg"); if(m){ m.className = "msg" + (err ? " err" : ""); m.textContent = t; } if(err) notice("الرواتب: " + t, true); };
  const p = projects[current], c = p.contract || {};
  if(!mcp){ say("الوصول إلى Google Drive غير متاح في هذا العرض.", true); return false; }
  const staff = staffOf(p); if(!staff.length){ say("لا يوجد موظفون لهم عقود.", true); return false; }
  if(!c.currency){ say("حدد العملة في إعدادات العقود.", true); return false; }
  try{
    say("جارٍ الحفظ…");
    const inp = await prSaveInputs();
    const [y, m] = prMonth.split("-").map(Number), dim = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const date = ddmmyyyy(y, m, dim), cur = c.currency;
    const pm = personByPos(p, (p.signatories || {}).pmPositionCode), fin = personByPos(p, inp.finPos);
    const ts = timesheets[p.code + "__" + prMonth] || {};
    const folder = await monthFolder(p, prMonth);
    const files = {...(inp.prev.files || {})}; files.vouchers = {...(files.vouchers || {})};
    // جدول الرواتب
    say("جارٍ إنشاء جدول الرواتب…");
    const pt = await loadX(templates.payroll);
    let x = rep(pt.xml, {TITLE: `جدول الرواتب الشهرية فريق سوريانا الأمل عن شهر ${MON_AR[m-1]} ${y} Monthly Payroll Schedule for Souryana Al-Amal Team for ${MON_EN[m-1]} ${y}`,
      SAL_HDR: `الراتب (${cur})`, DATE: date, FIN_NAME: fin ? fin.name : "", PM_NAME: pm ? pm.name : ""});
    for(let r = 7; r <= 19; r++){
      const it = staff[r - 7], d = it ? (inp.deductions[it.id] || {}) : {};
      const vals = it ? {A: r - 6, B: it.pos.code, C: it.v.name, D: gw(it.v.gender, it.pos.title_m, it.pos.title_f), E: Number(it.pos.salary) || 0, F: d.adv || 0, G: d.loan || 0, I: d.notes || ""}
                      : {A: null, B: null, C: null, D: null, E: null, F: null, G: null, I: null};
      for(const [col, v] of Object.entries(vals)) x = setCell(x, col + r, v);
    }
    for(let r = 7 + staff.length; r <= 19; r++) x = x.replace(new RegExp(`<row r="${r}"(?![^>]*hidden)`), `<row r="${r}" hidden="1"`);
    const pf = await saveXP(await buildX(pt, x), folder, `جدول الرواتب - ${prMonth}`, pt);
    await trashSet(files.payroll); files.payroll = pf;
    // الإيصالات والفواتير
    const vt = await loadX(templates.voucher);
    let n = 0;
    for(const {pos, v, id} of staff){
      n++; say(`جارٍ إنشاء إيصال ${v.name} (${n}/${staff.length})…`);
      const d = inp.deductions[id] || {}, sal = Number(pos.salary) || 0, net = sal - (d.adv || 0) - (d.loan || 0);
      const title = gw(v.gender, pos.title_m, pos.title_f), lv = ((ts.leave || {})[id] || []).length;
      let vx = rep(vt.xml, {DATE: date, NO: `${prMonth.replace("-","")}-${n}`, NAME: v.name, POSITION: title, CURRENCY: `Currency: ${cur}`,
        ANNUAL: lv ? `${lv} يوم` : "N/A", PERIOD: `Pay period: From ${ddmmyyyy(y, m, 1)} to ${date}`, WORDS: `${words(net)} ${cur} فقط لا غير`, ACCOUNTANT: fin ? fin.name : ""});
      vx = setCell(setCell(vx, "F14", sal), "F24", net);
      const base = `${pos.code} - ${v.nameEn || v.name}`;
      const vf = await saveXP(await buildX(vt, vx), folder, `إيصال راتب - ${prMonth} - ${base}`, vt);
      await trashSet(files.vouchers[id]); files.vouchers[id] = vf;
    }
    await db.doc("payroll/" + p.code + "__" + prMonth).update({files});
    say("تم إنشاء الرواتب."); return true;
  }catch(e){ say(e && e.code === "tool_error" ? (e.message || mcpMessage(e)) : mcpMessage(e), true); return false; }
}

/* مجلد الحفظ على الكمبيوتر */
let dirHandle = null;
function idb(){ return new Promise((res, rej) => { try{ const r = indexedDB.open("kadr", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }catch(e){ rej(e); } }); }
async function kvGet(k){ try{ const d = await idb(); return await new Promise(res => { const q = d.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); }catch(e){ return null; } }
async function kvSet(k, v){ try{ const d = await idb(); await new Promise(res => { const t = d.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = res; t.onerror = res; }); }catch(e){} }
const canPickDir = () => typeof window.showDirectoryPicker === "function";
async function loadDir(){ if(!canPickDir()) return; dirHandle = await kvGet("dir"); if(projects[current]) render(true); }
async function dirPerm(ask){
  if(!dirHandle) return false;
  try{ const o = {mode: "readwrite"}; if(await dirHandle.queryPermission(o) === "granted") return true; return ask ? (await dirHandle.requestPermission(o)) === "granted" : false; }catch(e){ return false; }
}
async function pickDir(){
  const m = docMsg() || $("#notice");
  try{ dirHandle = await window.showDirectoryPicker({mode: "readwrite", id: "kadr-docs"}); await kvSet("dir", dirHandle); m.className = "msg ok"; m.textContent = "تم تحديد المجلد: " + dirHandle.name; render(true); }
  catch(e){ if(e && e.name === "AbortError") return; m.className = "msg err"; m.textContent = "اختيار المجلد ممنوع في هذا العرض. افتح الصفحة في تبويب مستقل في Chrome أو Edge وجرّب مرة أخرى."; }
}
async function writeToDir(sub, name, blob){
  let d = dirHandle;
  if(sub) d = await d.getDirectoryHandle(sub, {create: true});
  const fh = await d.getFileHandle(name.replace(/[\\/:*?"<>|]/g, " "), {create: true});
  const w = await fh.createWritable(); await w.write(blob); await w.close();
}

let docState = {}; const mergedBlobs = {}; let dlNs;
async function saveMerged(ids, say){
  if(dirHandle && await dirPerm(true)){
    let ok = 0;
    for(const id of ids){ const m = mergedBlobs[id]; if(!m) continue; say(`جارٍ حفظ ملف ${m.label} في ${dirHandle.name}…`);
      try{ await writeToDir(projects[current].code, m.name, m.blob); ok++; }catch(e){ say("تعذّر الحفظ في المجلد: " + (e && e.message || e), true); break; } }
    if(ok){ say(`تم حفظ ${ok} ملف في ${dirHandle.name} ← ${projects[current].code}.`); return; }
  }
  dlNs = dlNs || await claude.use("downloads");
  if(!dlNs){ say("التنزيل غير متاح في هذا العرض.", true); return; }
  let ok = 0;
  for(const id of ids){
    const m = mergedBlobs[id]; if(!m) continue;
    say(`تأكيد حفظ ملف ${m.label}…`);
    try{ await dlNs.save({filename: m.name, data: m.blob}); ok++; }
    catch(e){ if(e && e.code === "declined") continue; if(e && e.code === "rate_limited"){ await new Promise(r => setTimeout(r, 1500)); try{ await dlNs.save({filename: m.name, data: m.blob}); ok++; }catch(_){} continue; }
      say("تعذّر التنزيل" + errDetail(e), true); return; }
  }
  say(`تم حفظ ${ok} ملف على الكمبيوتر.`);
}

/* ضغط الملفات الممسوحة ضوئياً */
const PDFJS_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
function canvasJpeg(canvas, q){ return new Promise(res => canvas.toBlob(b => b.arrayBuffer().then(a => res(new Uint8Array(a))), "image/jpeg", q)); }
async function shrinkPdf(bytes){
  if(!window.pdfjsLib || bytes.length < 180 * 1024) return bytes;
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
    const doc = await pdfjsLib.getDocument({data: bytes.slice(0)}).promise;
    const out = await PDFLib.PDFDocument.create();
    for(let i = 1; i <= doc.numPages; i++){
      const page = await doc.getPage(i), vp1 = page.getViewport({scale: 1});
      const scale = Math.min(2, 1240 / vp1.width), vp = page.getViewport({scale});
      const cv = document.createElement("canvas"); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
      const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
      await page.render({canvasContext: ctx, viewport: vp}).promise;
      const img = await out.embedJpg(await canvasJpeg(cv, 0.6));
      out.addPage([vp1.width, vp1.height]).drawImage(img, {x: 0, y: 0, width: vp1.width, height: vp1.height});
    }
    const r = await out.save();
    return r.length < bytes.length ? r : bytes;
  }catch(e){ return bytes; }
}
async function shrinkImage(u, type){
  try{
    const bmp = await createImageBitmap(new Blob([u], {type}));
    const sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc);
    const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(bmp, 0, 0, cv.width, cv.height);
    return {bytes: await canvasJpeg(cv, 0.7), jpg: true};
  }catch(e){ return {bytes: u, jpg: type === "image/jpeg"}; }
}

async function fetchBytes(fileId){
  const r = await mcp.callTool("Google Drive", "download_file_content", {fileId});
  const b64 = findB64(r, 0).replace(/\s/g,"");
  if(!b64) throw {code:"tool_error", message:"تعذّر تحميل ملف من الدرايف."};
  const bin = atob(b64); const u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return u;
}
async function toPdfBytes(fileId, folder){
  const u = await fetchBytes(fileId);
  const kind = u[0]===0x25&&u[1]===0x50 ? "pdf" : u[0]===0xFF&&u[1]===0xD8 ? "jpg" : u[0]===0x89&&u[1]===0x50 ? "png" : u[0]===0x50&&u[1]===0x4B ? "office" : "other";
  if(kind === "pdf") return u;
  if(kind === "jpg" || kind === "png"){
    const sm = await shrinkImage(u, kind === "jpg" ? "image/jpeg" : "image/png");
    const d = await PDFLib.PDFDocument.create(); const img = sm.jpg ? await d.embedJpg(sm.bytes) : await d.embedPng(sm.bytes);
    const W = 595, H = 842, sc = Math.min((W-60)/img.width, (H-60)/img.height, 1);
    const pg = d.addPage([W, H]); pg.drawImage(img, {x:(W-img.width*sc)/2, y:(H-img.height*sc)/2, width:img.width*sc, height:img.height*sc});
    return d.save();
  }
  if(kind === "office"){
    let b64 = ""; for(let i=0;i<u.length;i+=0x8000) b64 += String.fromCharCode.apply(null, u.subarray(i, i+0x8000)); b64 = btoa(b64);
    const gr = await mcp.callTool("Google Drive", "create_file", {title: "تحويل مؤقت", parentId: folder, contentMimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document", base64Content: b64});
    const gid = payloadId(gr);
    try{ return await fetchExport(gid); } finally { await trash(gid); }
  }
  return null;
}
async function fetchExport(gid){
  const ex = await mcp.callTool("Google Drive", "download_file_content", {fileId: gid, exportMimeType: "application/pdf"});
  const b64 = findB64(ex, 0).replace(/\s/g,""); const bin = atob(b64); const u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return u;
}

async function ensureFolder(title, parent, cacheKey, p){
  const cache = (p.docFolders || {});
  if(cache[cacheKey]) return cache[cacheKey];
  const fr = await mcp.callTool("Google Drive", "create_file", {title, parentId: parent, contentMimeType: "application/vnd.google-apps.folder"});
  const id = payloadId(fr); if(!id) throw {code:"tool_error", message:"لم يُنشأ مجلد التوثيقات."};
  await db.doc("projects/" + p.code).update({docFolders: {[cacheKey]: id}});
  p.docFolders = {...cache, [cacheKey]: id};
  return id;
}

/* المستندات المرقّمة: كل إيصال دفع مع مرفقاته = مستند واحد، يُرقَّم تسلسلياً حسب تاريخ الإيصال */
function receiptUnits(p){
  const u = [], pos0 = id => (p.positions || []).find(x => pid(x) === id);
  Object.entries(payrolls).filter(([k, d]) => k.startsWith(p.code + "__") && d.month).forEach(([k, d]) => {
    const [y, m] = d.month.split("-").map(Number), pf = d.files || {}, tf = (timesheets[p.code + "__" + d.month] || {}).files || {};
    Object.keys(pf.vouchers || {}).forEach(id => {
      const pos = pos0(id); if(!pos) return;
      const a = assignments[p.code + "__" + id], v = a && people[a.personKey], contract = contractDoc(a);
      const others = v ? (v.docs || []).concat(((a && a.docs) || []).filter(x => x.type !== "عقد العمل")) : [];
      const parts = [["إيصال الراتب", (pf.vouchers[id] || {}).pdf], ["جدول الرواتب", (pf.payroll || {}).pdf], ["جدول الدوام", (tf[id] || {}).pdf],
        ["العقد", contract && contract.fileId, {skipCover: !!(contract && contract.wordId)}], ["الهوية", v && v.idFileId], ["السيرة الذاتية", v && v.cvFileId]].concat(others.map(x => [x.type, x.fileId])).filter(x => x[1]);
      u.push({key: `pay:${d.month}:${id}`, date: monthEnd(d.month), month: d.month, line: pos.code, desc: `${pos.titleEn || pos.title} salary - ${MON_EN[m - 1]} ${y}`, amount: num(pos.salary), label: `${pos.code} - ${v ? v.name : pos.title}`, parts});
    });
  });
  exOf(p).filter(e => (e.files || {}).RCPT && (e.f || {}).rcptDate).forEach(e => {
    const pos = pos0(e.line) || {};
    u.push({key: "ex:" + e.id, date: e.f.rcptDate, month: e.f.rcptDate.slice(0, 7), line: pos.code || "", desc: e.descEn || pos.titleEn || e.title, amount: exTotals(e, true).total, label: `${pos.code ? pos.code + " - " : ""}${e.title}`, parts: exParts(p, e)});
  });
  u.sort((a, b) => a.date.localeCompare(b.date) || a.line.localeCompare(b.line, undefined, {numeric: true}) || a.key.localeCompare(b.key));
  u.forEach((x, i) => x.n = i + 1);
  return u;
}
/* المستند المدموج متغيّر إذا تغيّرت ملفاته منذ الدمج (src = معرّفات الملفات وقت الدمج) */
const srcOf = x => x.parts.map(q => q[1]);
const isStale = (x, df) => { const o = df[x.key]; return !!(o && o.src && o.src.join("|") !== srcOf(x).join("|")); };
const needMerge = (x, df) => !df[x.key] || isStale(x, df);
let legacyBusy = false;
async function checkLegacy(p){
  if(legacyBusy || !window.appStore || !window.appStore.fileTimes) return;
  const units = receiptUnits(p), df = p.docFiles || {}, old = units.filter(x => df[x.key] && !df[x.key].src);
  if(!old.length) return; legacyBusy = true;
  try{
    const t = await window.appStore.fileTimes(old.flatMap(x => [df[x.key].id, ...srcOf(x)]));
    const upd = {};
    old.forEach(x => { const o = df[x.key], tm = t[o.id]; if(!tm) return;
      const changed = srcOf(x).some(id => (t[id] || 0) > tm + 1000);
      upd[x.key] = {...o, src: changed ? ["?"] : srcOf(x)}; });
    if(Object.keys(upd).length){ await db.doc("projects/" + p.code).update({docFiles: upd}); p.docFiles = {...df, ...upd}; render(); }
  }finally{ legacyBusy = false; }
}
const docMismatch = (p, units) => { const map = Object.fromEntries(units.map(x => [x.key, x.n])); return Object.entries(p.docFiles || {}).filter(([k, o]) => map[k] && map[k] !== o.n); };

function renderDocs(p, kind){
  const box = $(kind === "pay" ? "#docBoxPay" : "#docBoxEx"); if(!box) return;
  const month = kind === "pay" ? docMonthPay : docMonthEx, pre = kind === "pay" ? "pay:" : "ex:";
  const st = docState[p.code + "__" + kind + month] || {}, units = receiptUnits(p), mine = units.filter(x => x.key.startsWith(pre) && (month === "all" || x.month === month)), bad = docMismatch(p, units), df = p.docFiles || {};
  const todo = mine.filter(x => needMerge(x, df)), nStale = todo.filter(x => df[x.key]).length, nNew = todo.length - nStale;
  setTimeout(() => checkLegacy(p).catch(() => {}));
  box.innerHTML = `<details class="settings panel" open><summary><span>دمج مستندات ${kind === "pay" ? "الموظفين" : "المصاريف"} — ${monLabel(month)}</span></summary>
    <div class="phead">${monthPick(kind === "pay" ? "docp" : "doce", month, true)}<span class="msg" id="doc-msg-${kind}" aria-live="polite"></span><button type="button" data-docmake="${kind}" ${todo.length ? "" : "disabled"}>${todo.length ? `دمج ${[nNew ? `الجديد (${nNew})` : "", nStale ? `المتغيّر (${nStale})` : ""].filter(Boolean).join(" و")}` : "كل المستندات محدّثة"}</button></div>
    <p class="code">كل إيصال دفع مع مرفقاته يُدمج في ملف PDF واحد اسمه رقمه التسلسلي في المشروع (حسب تاريخ الإيصال)، وهو نفسه رقم الحركة في التقرير المالي. يُحفظ في الدرايف ونسخة في مجلد الكمبيوتر.</p>
    ${mine.length ? `<div class="tscroll"><table class="ptab" style="min-width:420px"><thead><tr><th>الرقم</th><th>تاريخ الإيصال</th><th>المستند</th><th>الملف</th></tr></thead><tbody>

/* توحيد الصفحات على مقاس A4: الصفحات الصغيرة (كوجهي الهوية) تُجمع اثنتين في صفحة */
async function addA4(out, src, idx){
  const W = 595.28, H = 841.89, M = 28, isA4 = (w, h) => Math.abs(Math.min(w, h) - W) < 8 && Math.abs(Math.max(w, h) - H) < 8;
  let pending = null;
  const flush = () => { pending = null; };
  for(const i of idx){
    const pg = src.getPage(i), {width: w, height: h} = pg.getSize();
    if(isA4(w, h)){ flush(); const [cp] = await out.copyPages(src, [i]); out.addPage(cp); continue; }
    const ep = await out.embedPage(pg);
    const small = w <= W && h <= H / 2 + 20;
    if(small){
      const slotH = (H - 3 * M) / 2, sc = Math.min((W - 2 * M) / w, slotH / h);
      if(!pending){ const np = out.addPage([W, H]); np.drawPage(ep, {x: (W - w * sc) / 2, y: H - M - h * sc, width: w * sc, height: h * sc}); pending = np; }
      else { pending.drawPage(ep, {x: (W - w * sc) / 2, y: M + (slotH - h * sc), width: w * sc, height: h * sc}); pending = null; }
      continue;
    }
    flush();
    const land = w > h, PW = land ? H : W, PH = land ? W : H, sc = Math.min((PW - 2 * M) / w, (PH - 2 * M) / h);
    const np = out.addPage([PW, PH]); np.drawPage(ep, {x: (PW - w * sc) / 2, y: (PH - h * sc) / 2, width: w * sc, height: h * sc});
  }
}

async function buildDocs(say, kind){
  const month = kind === "pay" ? docMonthPay : docMonthEx, pre = kind === "pay" ? "pay:" : "ex:";
  const p = projects[current], units = receiptUnits(p), all = units.filter(x => x.key.startsWith(pre) && (month === "all" || x.month === month));
  if(!all.length) throw {code: "tool_error", message: "لا توجد إيصالات دفع في هذه الفترة."};
  const mine = all.filter(x => needMerge(x, p.docFiles || {}));
  if(!mine.length){ say("كل المستندات محدّثة، لا شيء يحتاج دمجاً."); return 0; }
  if(docMismatch(p, units).length) throw {code: "tool_error", message: "يوجد مستندات بأرقام قديمة. اضغط «إعادة الترقيم» أولاً."};
  const root = await ensureFolder(DOC_ROOT, (p.folders || {}).project, "root", p);
  const local = dirHandle && await dirPerm(true), docFiles = {...(p.docFiles || {})}, out = [];
  for(const k in mergedBlobs) delete mergedBlobs[k];
  let n = 0;
  for(const x of mine){
    n++;
    const merged = await PDFLib.PDFDocument.create(), skipped = [];
    for(const [t, fid, opt] of x.parts){
      say(`جارٍ دمج المستند ${x.n} (${n}/${mine.length}) — ${t}…`);
      try{ const bytes = await toPdfBytes(fid, root); if(!bytes){ skipped.push(t); continue; }
        const src = await PDFLib.PDFDocument.load(bytes, {ignoreEncryption: true});
        let idx = src.getPageIndices(); if(opt && opt.skipCover && idx.length > 1) idx = idx.slice(1);
        await addA4(merged, src, idx); }
      catch(e){ skipped.push(t); }
    }
    const blob = new Blob([await merged.save()], {type: "application/pdf"}), name = `${x.n}.pdf`;
    say(`جارٍ حفظ ${name} في الدرايف…`);
    const old = docFiles[x.key];
    const up = await upload(new File([blob], name, {type: "application/pdf"}), root, String(x.n));
    if(old && old.id && old.id !== up.id) await trash(old.id).catch(() => {});
    docFiles[x.key] = {id: up.id, n: x.n, at: today(), src: srcOf(x)};
    if(local){ try{ await writeToDir(p.code, name, blob); }catch(e){ say("تعذّر الحفظ في مجلد الكمبيوتر: " + (e && e.message || e), true); } }
    else mergedBlobs[x.key] = {blob, name, label: String(x.n), skipped};
    out.push(`${dlink(up.id, name)}${skipped.length ? ` <span class="code">(لم يُدمج: ${esc(skipped.join("، "))})</span>` : ""}`);
  }
  await db.doc("projects/" + p.code).update({docFiles}); p.docFiles = docFiles;
  docState[p.code + "__" + kind + month] = {links: out.join(" · ") + (!local && Object.keys(mergedBlobs).length ? ` <button type="button" data-dlall>تنزيل نسخة على الكمبيوتر</button>` : "")};
  renderDocs(p, kind);
  return mine.length;
}

const FORMS = [["PR","طلب شراء"],["RFQ","عرض سعر"],["PO","أمر شراء"],["CONTRACT","عقد"],["GRN","محضر استلام مواد"],["SRN","محضر استلام خدمة"],["ATT","مستفيدو المواصلات"],["INV","فاتورة (من المورد أو يولّدها النظام)"],["RCPT","إيصال دفع"]];
const FORM_CODE = {CONTRACT:"Contract", ATT:"Attendance", RCPT:"Receipt"};
const DROPPED = ["سند ملكية","صور توثيقية","تقرير عمل أو منتج","ترخيص أو سجل تجاري","إيصال رسمي من الجهة","فاتورة المورد"];
const NUMBERED = [["PR","طلب الشراء"],["PO","أمر الشراء"],["GRN","محضر استلام المواد"],["SRN","محضر استلام الخدمة"],["RCPT","إيصال الدفع"]];
const SIGNERS = [["requester","الطالب"],["finance","المراجعة المالية"],["approver","المعتمد"],["receiver","المستلم (GRN)"],["supervisor","المشرف (SRN)"],["accountant","المحاسب (الإيصال)"]];
const EXP_DEFAULT = () => ({
  docTypes: ["صورة هوية","سيرة ذاتية","كشف حضور المشاركين"],
  categories: [["hosp","ضيافة"],["buffet","بوفيه"],["stat","قرطاسية"],["print","مطبوعات"],["expert","خبير"],["trainer","مدرب"],["transport","مواصلات"],["hall","إيجار قاعة"],["equip","إيجار معدات"],["observer","ملاحظ"],["cook","طباخ"],["internet","خدمات إنترنت"],["rent","إيجار مقر"],["permit","رسوم ترخيص"]]
    .map(([id, name]) => ({id, name, forms: [], docs: {}})),
  thresholds: [{upTo:"", quotes:1, tender:false, opening:false},{upTo:"", quotes:3, tender:false, opening:true},{upTo:"", quotes:3, tender:true, opening:true}]
});
const catDone = c => Object.keys(c.docs || {}).length > 0;
const LINE_DEFAULT = {"2.2.1":"expert","2.2.2":"expert","3.1":"rent","3.2":"permit"};
function ecfg(){
  const c = JSON.parse(JSON.stringify(expCfg || EXP_DEFAULT()));
  c.docTypes = (c.docTypes || []).filter(t => !DROPPED.includes(t));
  (c.categories || []).forEach(k => { const d = k.docs || {};
    if(d["فاتورة المورد"] && !d.INV) d.INV = d["فاتورة المورد"];
    DROPPED.forEach(t => delete d[t]); k.docs = d; k.forms = FORMS.map(x => x[0]).filter(f => d[f]); });
  return c;
}
const sameArr = (a, b) => JSON.stringify(a) === JSON.stringify(b);

function thrTable(list, key){
  const rows = (list || []).map((t, i) => `<tr data-thr="${key}">
    <td><input name="tup" type="number" min="0" value="${esc(t.upTo)}" placeholder="${i === list.length - 1 ? "فما فوق" : "المبلغ"}" aria-label="حتى مبلغ"></td>
    <td><input name="tq" type="number" min="0" max="10" value="${esc(t.quotes)}" aria-label="عدد العروض"></td>
    <td><input name="tt" type="checkbox" ${t.tender ? "checked" : ""} aria-label="مناقصة"></td>
    <td><input name="to" type="checkbox" ${t.opening ? "checked" : ""} aria-label="محضر فض عروض"></td>
    <td><button type="button" class="x" data-act="thrdel">حذف</button></td></tr>`).join("");
  return `<div class="tscroll"><table class="ptab ftab" style="min-width:520px"><thead><tr><th>حتى مبلغ (إجمالي الفاتورة)</th><th>عدد العروض</th><th>مناقصة</th><th>محضر فض عروض</th><th></th></tr></thead>
    <tbody data-thrbody="${key}">${rows}</tbody></table></div>
    <button type="button" class="ghost" data-act="thradd" data-key="${key}">+ عتبة</button>`;
}
function readThr(key){
  return [...document.querySelectorAll(`tr[data-thr="${key}"]`)].map(tr => {
    const q = n => tr.querySelector(`[name="${n}"]`);
    return {upTo: q("tup").value === "" ? "" : Number(q("tup").value), quotes: Number(q("tq").value) || 0, tender: q("tt").checked, opening: q("to").checked};
  });
}

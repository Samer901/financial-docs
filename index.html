function exWarnings(p, e){
  const f = e.f || {}, forms = exForms(exCat(p, e)), w = [];
  const seq = [["PR","prDate","طلب الشراء"],["RFQ","rfqDate","إرسال عرض السعر"],["PO","poDate","أمر الشراء"],["CONTRACT","cDate","تحرير العقد"],["CONTRACT","cStart","بداية التنفيذ"],
    ["CONTRACT","cEnd","نهاية التنفيذ"],["GRN","grnDate","استلام المواد"],["SRN","srnDate","استلام الخدمة"],["INV","invDate","الفاتورة"],["RCPT","rcptDate","الإيصال"]]
    .filter(([k, n]) => forms.includes(k) && f[n]);
  for(let i = 1; i < seq.length; i++){ const [, n, l] = seq[i];
    const prev = seq.slice(0, i).filter(x => f[x[1]] > f[n]).pop();
    if(prev) w.push(`تاريخ ${l} (${dmy(f[n])}) قبل تاريخ ${prev[2]} (${dmy(f[prev[1]])}).`); }
  if(f.delDate && f.prDate && f.delDate < f.prDate) w.push("تاريخ التسليم قبل تاريخ طلب الشراء.");
  if(f.rfqEnd && f.rfqDate && f.rfqEnd < f.rfqDate) w.push("انتهاء صلاحية العرض قبل تاريخ إرساله.");
  if(forms.includes("SRN") && f.srnDate && f.cEnd && f.srnDate < f.cEnd) w.push("استلام الخدمة قبل نهاية التنفيذ.");
  seq.forEach(([, n, l]) => { if(p.start && f[n] < p.start) w.push(`تاريخ ${l} قبل بداية المشروع (${dmy(p.start)}).`); else if(p.end && f[n] > p.end) w.push(`تاريخ ${l} بعد نهاية المشروع (${dmy(p.end)}).`); });
  return w;
}

async function exGenerate(card, codes, say){
  const p = projects[current];
  if(!mcp){ say("الوصول إلى Google Drive غير متاح في هذا العرض.", true); return; }

    const warn = exWarnings(p, exRead(card));
    if(warn.length && card.dataset.okdates !== "1"){ card.dataset.okdates = "1"; say("تواريخ غير متسلسلة (انظر التنبيه). اضغط زر الإنشاء مرة أخرى للمتابعة رغم ذلك.", true); return; }
    delete card.dataset.okdates;
    say("جارٍ الحفظ…");
    const e = await exSave(card, say), key = card.dataset.exKey;
    const cat = exCat(p, e);
    const list = (codes && codes[0] === "CONTRACT_WORD" ? ["CONTRACT"] : (codes || exForms(cat))).filter(c => (FORM_TPL[c] || c === "CONTRACT") && !(c === "INV" && (e.f || {}).invSrc !== "system"));
    if(list.includes("RCPT") && !(e.f || {}).rcptDate){ say("أدخل تاريخ الإيصال أولاً.", true); return; }
    for(const c of list){ if(c === "CONTRACT" && codes && codes[0] === "CONTRACT_WORD"){ await exContract(p, e, say, true); continue; } if(c === "CONTRACT"){ if(!(codes || []).includes("CONTRACT") && (e.files || {}).CONTRACT && (e.files.CONTRACT || {}).signed) continue; await exContract(p, e, say); } else await exGenForm(p, e, c, say); }
    e.done = !!(e.files || {}).RCPT;
    await db.doc("expenses/" + key).set(e);
    editing = false; exOpen.add(key); render(true);
    const m = document.querySelector(`[data-ex-key="${CSS.escape(key)}"] .exmsg`); if(m){ m.className = "msg exmsg ok"; m.textContent = "تم الإنشاء."; }

}

function exParts(p, e){
  const cat = exCat(p, e), files = e.files || {}, parts = [];
  for(const c of exForms(cat)){ const o = files[c]; if(!o) continue;
    [].concat(o).forEach((x, i, arr) => parts.push([(FORM_CODE[c] || c) + (arr.length > 1 ? " " + (i + 1) : ""), x.pdf || x.id || x.xlsx])); }
  exAttach(cat).forEach(t => { const id = attFile(e, t); if(id) parts.push([t, id]); });
  return parts.filter(x => x[1]);
}

/* ===== التقرير المالي للمانح (تراكمي) ===== */
const REPORT_TPL = "1qsk1RpPRWvMzBpDokjRobDIWuIe_JrcA";
const SUM_ROWS = {"1.1":15,"1.2":16,"1.3":17,"1.4":18,"2.1.1":20,"2.1.2":21,"2.1.3":22,"2.1.4":23,"2.1.5":24,"2.2.1":26,"2.2.2":27,"2.2.3":28,"2.2.4":29,"2.2.5":30,"3.1":32,"3.2":33,"3.3":34,"3.4":35};
const monthEnd = ym => { const [y, m] = ym.split("-").map(Number); return `${ym}-${String(new Date(Date.UTC(y, m, 0)).getUTCDate()).padStart(2, "0")}`; };
function projMonthList(p, upto){ const out = []; let [y, m] = (p.start || upto + "-01").slice(0, 7).split("-").map(Number);
  while(`${y}-${String(m).padStart(2, "0")}` <= upto && out.length < 60){ out.push(`${y}-${String(m).padStart(2, "0")}`); m++; if(m > 12){ m = 1; y++; } } return out; }
const lineTotal = (p, pos) => num(pos.salary) * (num(pos.count) || (isStaff(pos) ? num((p.contract || {}).months) : 1) || 1);

function txList(p, upto){
  const end = monthEnd(upto);
  return receiptUnits(p).filter(x => x.date <= end).map(x => ({n: x.n, date: x.date, line: x.line, desc: x.desc, amount: x.amount, month: x.month}));
}

  </details>`;
}

async function rpSave(){
  const p = projects[current], ex = p.expense || {};
  const eurRates = {...(ex.eurRates || {})}; document.querySelectorAll("[data-rate]").forEach(i => { if(i.value !== "") eurRates[i.dataset.rate] = Number(i.value); else delete eurRates[i.dataset.rate]; });
  const o = {eurRates, approvedEur: $("#rp-appr").value === "" ? "" : Number($("#rp-appr").value), receivedEur: $("#rp-recv").value === "" ? "" : Number($("#rp-recv").value), orgEn: $("#rp-org").value.trim()};
  await db.doc("projects/" + p.code).update({expense: {...ex, ...o}});
  p.expense = {...ex, ...o};

}

async function rpMake(say){
  const p = projects[current];
  if(!mcp){ say("الوصول إلى Google Drive غير متاح في هذا العرض.", true); return; }
  try{
    say("جارٍ الحفظ…");
    const ex = await rpSave(), tx = txList(p, rpMonth);
    if(!tx.length){ say("لا توجد إيصالات حتى نهاية هذا الشهر.", true); return; }
    const missing = [...new Set(tx.map(t => t.month))].filter(m => !num((ex.eurRates || {})[m]));
    if(missing.length){ say("أدخل سعر صرف اليورو للأشهر: " + missing.join("، "), true); return; }
    tx.forEach(t => t.eur = Math.round(t.amount / ex.eurRates[t.month] * 100) / 100);
    const totLocal = tx.reduce((s, t) => s + t.amount, 0), totEur = tx.reduce((s, t) => s + t.eur, 0), avg = totEur ? Math.round(totLocal / totEur * 100) / 100 : "";
    say("جارٍ تحميل القالب…");
    const r = await mcp.callTool("Google Drive", "download_file_content", {fileId: templates.donorReport || REPORT_TPL});
    const b64 = findB64(r, 0).replace(/\s/g, ""); if(!b64) throw {code: "tool_error", message: "تعذّرت قراءة قالب التقرير."};
    const zip = await JSZip.loadAsync(b64, {base64: true});
    const wb = await zip.file("xl/workbook.xml").async("string"), rels = await zip.file("xl/_rels/workbook.xml.rels").async("string");
    const sheetFile = name => { const m = wb.match(new RegExp(`<sheet [^>]*name="${name}"[^>]*r:id="([^"]+)"`)); if(!m) return null;
      const t = rels.match(new RegExp(`<Relationship [^>]*Id="${m[1]}"[^>]*Target="([^"]+)"`)) || rels.match(new RegExp(`<Relationship [^>]*Target="([^"]+)"[^>]*Id="${m[1]}"`)); return t ? "xl/" + t[1].replace(/^\/?xl\//, "") : null; };
    const fSum = sheetFile("FinancialReportSummary"), fTx = sheetFile("Transactions1");
    if(!fSum || !fTx) throw {code: "tool_error", message: "القالب لا يحتوي ورقتي الملخص وTransactions1."};
    // سجل الصرف
    let x = await zip.file(fTx).async("string");
    const extra = tx.length - 40;
    if(extra > 0){
      const row45 = (x.match(/<row r="45"[\s\S]*?<\/row>/) || [""])[0];
      let add = ""; for(let i = 0; i < extra; i++){ const r = 46 + i; add += row45.replace(/<row r="45"/, `<row r="${r}"`).replace(/r="([A-Z]+)45"/g, (m0, c) => `r="${c}${r}"`).replace(/<f>[\s\S]*?<\/f>/g, "").replace(/<v>[\s\S]*?<\/v>/g, ""); }
      x = x.replace(/(<row r="45"[\s\S]*?<\/row>)/, "$1" + add).replace(/<dimension ref="[^"]+"\/>/, `<dimension ref="A1:J${45 + extra}"/>`);
    }
    x = setCell(setCell(setCell(x, "D1", ex.orgEn || ""), "E4", Math.round(totLocal)), "I4", avg);
    for(let i = 0; i < Math.max(40, tx.length); i++){
      const r = 6 + i, t = tx[i];
      const v = t ? {A: t.n, B: t.line, C: dmy(t.date), D: t.desc, E: t.amount, F: t.amount, G: t.eur, H: "C", I: ""} : {A: null, B: null, C: null, D: null, E: null, F: null, G: null, H: null, I: null};
      for(const [c, val] of Object.entries(v)) x = setCell(x, c + r, val);
    }
    zip.file(fTx, x);
    // الملخص
    let s = await zip.file(fSum).async("string");
    const end = monthEnd(rpMonth), lines = (p.positions || []), grand = lines.reduce((t, pos) => t + lineTotal(p, pos), 0);
    s = setCell(setCell(setCell(setCell(s, "E5", ex.orgEn || ""), "E7", p.name || p.code), "E9", `${dmy(p.start)} - ${dmy(end)}`), "E11", avg);
    const byLine = {}; tx.forEach(t => { byLine[t.line] = (byLine[t.line] || 0) + t.eur; });
    for(const [code, r] of Object.entries(SUM_ROWS)){
      const pos = lines.find(x => x.code === code);
      const appr = pos && num(ex.approvedEur) && grand ? Math.round(lineTotal(p, pos) / grand * num(ex.approvedEur) * 100) / 100 : null;
      const spent = byLine[code] ? Math.round(byLine[code] * 100) / 100 : (pos ? 0 : null);
      s = setCell(s, "D" + r, pos ? (pos.titleEn || pos.title) : "xxxxxx");
      s = setCell(setCell(setCell(s, "E" + r, appr), "F" + r, spent), "H" + r, spent);
    }
    if(ex.receivedEur !== "" && ex.receivedEur !== undefined) s = setCell(s, "H37", num(ex.receivedEur));
    zip.file(fSum, s);
    // إزالة سلسلة الحساب القديمة ليعيد البرنامج الحساب
    if(zip.file("xl/calcChain.xml")){ zip.remove("xl/calcChain.xml");
      zip.file("[Content_Types].xml", (await zip.file("[Content_Types].xml").async("string")).replace(/<Override[^>]*calcChain[^>]*\/>/, ""));
      zip.file("xl/_rels/workbook.xml.rels", rels.replace(/<Relationship[^>]*calcChain[^>]*\/>/, "")); }
    const XT = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
    const blob = await zip.generateAsync({type: "blob", mimeType: XT, compression: "DEFLATE", compressionOptions: {level: 9}});
    say("جارٍ الحفظ في الدرايف…");
    const folder = await ensureFolder("التقارير المالية", (p.folders || {}).project, "reports", p);
    const base = `Financial Report - ${p.code} - ${rpMonth}`;
    const xu = await upload(new File([blob], base + ".xlsx", {type: XT}), folder, base);
    const old = (ex.reports || {})[rpMonth]; if(old) await trashSet(old).catch(() => {});
    await db.doc("projects/" + p.code).update({expense: {...ex, reports: {...(ex.reports || {}), [rpMonth]: {xlsx: xu.id, at: today()}}}});
    editing = false; render(true);
    const m = $("#rp-msg"); if(m){ m.className = "msg ok"; m.textContent = `تم إنشاء التقرير (${tx.length} حركة).`; }
  }catch(e){ say(e && e.code === "tool_error" ? (e.message || mcpMessage(e)) : mcpMessage(e), true); }
}
